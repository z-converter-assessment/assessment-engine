# prod file-secret overlay (ADR 0046) — base 에 얹어 쓴다. 단독으로는 유효한 compose 파일이 아니다
# (image 를 base 가 갖고 있어, 이 파일만 검증하는 도구는 "image 도 build 도 없다" 고 지적한다).
#
# .env.example 의 COMPOSE_FILE 이 base 와 함께 지정하므로 배포 VM 은 `docker compose up -d` 한 줄이면 된다.
# 그 변수 없이 쓰려면 -f 로 둘을 직접 준다.
#
# 비밀번호를 env 가 아니라 파일로 넣는다 — env 로 넣으면 docker inspect·compose config·/proc/environ 에
# 그대로 드러난다. 호스트 디스크의 평문은 남으므로 디렉토리 권한과 디스크 암호화는 운영자 책임이다.
# 파일 권한 근거와 배치 절차는 secrets/README.md.
#
# 파일명이 pydantic 필드명과 같아야 app 의 secrets_dir 가 자동으로 매핑한다.
# 각 서비스의 password 환경변수를 null 로 중화하는 것은 base 의 ${*_PASSWORD:-changeme} 보간을 지우기
# 위해서다 — 그대로 두면 secret 이 env 에도 뜨고, postgres 는 PASSWORD 와 _FILE 이 함께 있으면 죽는다.
#
# dev overlay 는 본 파일을 로드하지 않아 영향이 없다.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password

services:
  web:
    environment:
      POSTGRES_PASSWORD:
      RABBITMQ_PASSWORD:
    secrets:
      - postgres_password
      - rabbitmq_password

  consumer:
    environment:
      POSTGRES_PASSWORD:
      RABBITMQ_PASSWORD:
    secrets:
      - postgres_password
      - rabbitmq_password

  worker:
    # 전용 백그라운드 워커 — DB job-claim 만(broker 미사용) 이라 postgres_password 만.
    environment:
      POSTGRES_PASSWORD:
    secrets:
      - postgres_password

  migrate:
    environment:
      POSTGRES_PASSWORD:
    secrets:
      - postgres_password

  postgres:
    environment:
      # PASSWORD 는 null 중화, _FILE 로 대체 (둘 다 set 이면 entrypoint 에러).
      POSTGRES_PASSWORD:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  rabbitmq:
    # rabbitmq:3.13 은 RABBITMQ_DEFAULT_PASS_FILE 미지원(제거됨) — entrypoint wrapper 로 파일을 읽어 주입.
    # DEFAULT_PASS 는 첫 부팅에만 유효(기존 env 동작과 동일). USER 는 식별자라 base env 유지.
    # 잔여 한계: wrapper 의 export 가 컨테이너 내부 프로세스 env(/proc/PID/environ, 컨테이너 root 한정)에
    # 잠시 노출. docker inspect 의 정적 Config.Env 엔 안 뜸. 완전 격리는 rabbitmq.conf hashed
    # load_definitions 필요(과복잡, 미채택 — ADR 0046).
    environment:
      RABBITMQ_DEFAULT_PASS:
    entrypoint:
      - /bin/sh
      - -c
      - export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password
