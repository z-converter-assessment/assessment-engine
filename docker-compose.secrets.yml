# docker-compose.secrets.yml — prod 전용 file-secret 채널 overlay (opt-in, ADR 0046).
#
# 기동: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#   또는 COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml 설정 후 docker compose up -d
#
# 비번을 ./secrets/* 파일(권한 600)에서 컨테이너 /run/secrets/* 로 주입 — secret 이 컨테이너 env
# (docker inspect·compose config·/proc/environ)에 안 뜬다(env 노출 회피). 호스트 디스크 평문은 남으므로
# 파일 권한 600·디스크 암호화는 운영자 책임.
#
# dev(docker-compose.override.yml)는 본 overlay 를 로드하지 않으므로 평문 .env 그대로 — 영향 0.
#
# secret 파일명 = pydantic 필드명(postgres_password·rabbitmq_password) — app 의 secrets_dir(/run/secrets)
# 자동 매핑 조건. 각 서비스의 password 환경변수를 null 로 중화해 base 의 ${*_PASSWORD:-changeme} 보간을
# 제거한다(secret 이 env 로 안 뜨게 + postgres 의 PASSWORD/_FILE 동시 set 에러 회피).

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password
  pgadmin_password:
    file: ./secrets/pgadmin_password

services:
  web:
    environment:
      POSTGRES_PASSWORD:
      RABBITMQ_PASSWORD:
    secrets:
      - postgres_password
      - rabbitmq_password

  consumer:
    environment:
      POSTGRES_PASSWORD:
      RABBITMQ_PASSWORD:
    secrets:
      - postgres_password
      - rabbitmq_password

  migrate:
    environment:
      POSTGRES_PASSWORD:
    secrets:
      - postgres_password

  postgres:
    environment:
      # PASSWORD 는 null 중화, _FILE 로 대체 (둘 다 set 이면 entrypoint 에러).
      POSTGRES_PASSWORD:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  rabbitmq:
    # rabbitmq:3.13 은 RABBITMQ_DEFAULT_PASS_FILE 미지원(제거됨) — entrypoint wrapper 로 파일을 읽어 주입.
    # DEFAULT_PASS 는 첫 부팅에만 유효(기존 env 동작과 동일). USER 는 식별자라 base env 유지.
    # 잔여 한계: wrapper 의 export 가 컨테이너 내부 프로세스 env(/proc/PID/environ, 컨테이너 root 한정)에
    # 잠시 노출. docker inspect 의 정적 Config.Env 엔 안 뜸. 완전 격리는 rabbitmq.conf hashed
    # load_definitions 필요(과복잡, 미채택 — ADR 0046).
    environment:
      RABBITMQ_DEFAULT_PASS:
    entrypoint:
      - /bin/sh
      - -c
      - export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password

  pgadmin:
    environment:
      PGADMIN_DEFAULT_PASSWORD:
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
