# prod 명시 호출용 override.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 핵심 차이 (base 대비):
# - secret을 환경변수가 아닌 Docker secrets로 주입 (.env 평문 사용 안 함)
# - PostgreSQL/RabbitMQ는 _FILE suffix 환경변수로 secret 파일 경로 지정 (공식 이미지 표준)
# - Python 앱(web/consumer)은 pydantic-settings의 secrets_dir(/run/secrets) 자동 read
# - web만 외부 포트 노출 (DB·MQ·Redis는 노출 안 함 — reverse proxy 뒤에서만 접근)
#
# 사전 조건:
# 1. ./secrets/postgres_password, ./secrets/rabbitmq_password 파일 생성 (root 0400 권장)
# 2. APP_ENV=prod 환경변수가 설정되어 있어 model_validator가 검증
# 3. schema는 Alembic으로 사전 적용 (lifespan은 prod에서 schema bootstrap skip)

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password

  migrate:
    environment:
      APP_ENV: prod
    secrets:
      - postgres_password

  web:
    environment:
      APP_ENV: prod
    secrets:
      - postgres_password
      - rabbitmq_password   # AI 진단 publish용 (ADR 0004)
    ports:
      - "${WEB_PORT:-8000}:8000"   # 일반적으로 reverse proxy 뒤로. 직접 노출이 필요하면 그대로.

  consumer:
    environment:
      APP_ENV: prod
    secrets:
      - postgres_password
      - rabbitmq_password

  diagnostic-worker:
    environment:
      APP_ENV: prod
    secrets:
      - postgres_password
      - rabbitmq_password

  diagnostic-scheduler:
    environment:
      APP_ENV: prod
    secrets:
      - postgres_password
      - rabbitmq_password

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password