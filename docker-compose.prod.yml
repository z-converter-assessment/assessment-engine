
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password

services:
  web:
    secrets:
      - postgres_password
      - rabbitmq_password

  consumer:
    secrets:
      - postgres_password
      - rabbitmq_password

  worker:
    secrets:
      - postgres_password

  migrate:
    secrets:
      - postgres_password

  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  rabbitmq:
    # RabbitMQ 3.13은 _FILE 변수를 지원하지 않아 entrypoint 전에 secret 값을 주입한다.
    entrypoint: ["/bin/sh", "-c", "export RABBITMQ_DEFAULT_PASS=\"$(cat /run/secrets/rabbitmq_password)\"; exec docker-entrypoint.sh rabbitmq-server"]
    secrets:
      - rabbitmq_password
