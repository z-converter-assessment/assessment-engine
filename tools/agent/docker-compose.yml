# 테스트용 에이전트 시뮬레이터 — MQ 직접 발행 검증용
# 스케일: docker compose up --scale agent=3

services:
  agent:
    build: .
    image: agent:latest
    restart: unless-stopped
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "32m"
        reservations:
          cpus: "0.01"
          memory: "16m"
