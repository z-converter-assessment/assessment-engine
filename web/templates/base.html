<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ZConverter Assessment{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #1a1a1a; background: #f5f5f5; }
    header { background: #1e293b; color: #fff; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 24px; }
    header a { color: #94a3b8; text-decoration: none; font-size: 13px; }
    header a:hover { color: #fff; }
    header .brand { color: #fff; font-weight: 600; font-size: 15px; margin-right: 16px; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #0f172a; }
    h2 { font-size: 16px; font-weight: 600; margin: 28px 0 12px; color: #334155; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    thead { background: #f1f5f9; }
    th { padding: 10px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    td { padding: 12px 16px; border-top: 1px solid #f1f5f9; color: #334155; }
    tr:hover td { background: #f8fafc; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #dbeafe; color: #1d4ed8; }
    .badge-ok   { background: #dcfce7; color: #166534; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px 24px; margin-bottom: 20px; }
    .kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; }
    .kv dt { color: #64748b; font-size: 13px; }
    .kv dd { color: #0f172a; font-weight: 500; }
    .back { font-size: 13px; color: #64748b; margin-bottom: 16px; display: inline-block; }
    pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; font-size: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <span class="brand">ZConverter Assessment</span>
    <a href="/servers/">서버 목록</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
