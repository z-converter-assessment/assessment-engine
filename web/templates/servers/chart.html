{% extends "base.html" %}
{% block title %}차트 — {{ server.hostname }} — ZConverter Assessment{% endblock %}

{% block content %}
<a class="back" href="/servers/{{ server.id }}">← {{ server.hostname }}</a>
<h1>{{ server.hostname }} — 시계열 차트</h1>

<!-- 툴바 -->
<div class="card" style="margin-bottom:16px;">
  <div style="display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end;">

    <div>
      <div style="font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;">메트릭</div>
      <div class="toggle-group" id="metric-btns">
        <button class="toggle active" data-val="cpu.usage_percent">CPU 사용률</button>
        <button class="toggle" data-val="disk.read_iops">Disk Read IOPS</button>
        <button class="toggle" data-val="disk.write_iops">Disk Write IOPS</button>
        <button class="toggle" data-val="fs.usage_percent">FS 사용률</button>
        <button class="toggle" data-val="net.rx_bytes_per_sec">Net RX</button>
        <button class="toggle" data-val="net.tx_bytes_per_sec">Net TX</button>
      </div>
    </div>

    <div>
      <div style="font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;">기간</div>
      <div class="toggle-group" id="range-btns">
        <button class="toggle" data-val="15m">15분</button>
        <button class="toggle active" data-val="1h">1시간</button>
        <button class="toggle" data-val="6h">6시간</button>
        <button class="toggle" data-val="24h">24시간</button>
        <button class="toggle" data-val="7d">7일</button>
      </div>
    </div>

    <div>
      <div style="font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;">집계</div>
      <div class="toggle-group" id="agg-btns">
        <button class="toggle active" data-val="avg">평균</button>
        <button class="toggle" data-val="max">최대</button>
        <button class="toggle" data-val="p95">p95</button>
      </div>
    </div>

  </div>
</div>

<!-- 차트 -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
    <h2 id="chart-title" style="margin:0;">CPU 사용률</h2>
    <span id="chart-status" style="font-size:12px; color:#94a3b8;"></span>
  </div>
  <div style="position:relative; height:320px;">
    <canvas id="chart-canvas"></canvas>
  </div>
  <div id="chart-empty" style="display:none; text-align:center; padding:60px 0; color:#94a3b8; font-size:13px;">
    해당 기간에 수집된 데이터가 없습니다.
  </div>
</div>

<style>
  .toggle-group { display:flex; gap:4px; flex-wrap:wrap; }
  .toggle {
    padding:5px 12px; border:1px solid #e2e8f0; border-radius:5px;
    background:#fff; color:#475569; font-size:12px; cursor:pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .toggle:hover { background:#f8fafc; border-color:#cbd5e1; }
  .toggle.active { background:#0f172a; color:#fff; border-color:#0f172a; }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const SERVER_ID  = {{ server.id }};
const COLORS = ['#3b82f6','#f59e0b','#22c55e','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899'];

const METRIC_LABELS = {
  'cpu.usage_percent':   'CPU 사용률',
  'disk.read_iops':      'Disk Read IOPS',
  'disk.write_iops':     'Disk Write IOPS',
  'fs.usage_percent':    'FS 사용률',
  'net.rx_bytes_per_sec':'네트워크 수신',
  'net.tx_bytes_per_sec':'네트워크 송신',
};

const AUTO_BUCKET = { '15m':'5m', '1h':'5m', '6h':'1h', '24h':'1h', '7d':'1d' };

let metricType = 'cpu.usage_percent';
let timeRange  = '1h';
let agg        = 'avg';
let chart      = null;

/* ── 포맷 ── */
function fmtLabel(ts) {
  const d = new Date(ts);
  const opts = timeRange === '7d'
    ? { timeZone:'Asia/Seoul', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }
    : { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit' };
  return d.toLocaleString('ko-KR', opts);
}

function fmtY(val) {
  if (val == null) return '';
  if (metricType.endsWith('_percent'))  return val.toFixed(1) + '%';
  if (metricType.endsWith('_iops'))     return val.toFixed(1) + ' IOPS';
  if (metricType.includes('bytes_per')) {
    if (val >= 1024 * 1024) return (val / 1024 / 1024).toFixed(1) + ' MB/s';
    if (val >= 1024)        return (val / 1024).toFixed(1) + ' kB/s';
    return val.toFixed(0) + ' B/s';
  }
  return val.toFixed(1);
}

function yAxisLabel() {
  if (metricType.endsWith('_percent'))  return '%';
  if (metricType.endsWith('_iops'))     return 'IOPS';
  if (metricType.includes('bytes_per')) return 'B/s';
  return '';
}

/* ── 데이터 그룹화 ── */
function buildDatasets(rows) {
  const byDim = {};
  for (const r of rows) {
    const k = r.dimension ?? '__';
    (byDim[k] = byDim[k] || []).push(r);
  }

  const allTs = [...new Set(rows.map(r => r.collected_at))].sort();
  const labels = allTs.map(fmtLabel);

  const datasets = Object.entries(byDim).map(([dim, pts], i) => {
    const map = Object.fromEntries(pts.map(p => [p.collected_at, p.value]));
    const color = COLORS[i % COLORS.length];
    return {
      label:           dim === '__' ? METRIC_LABELS[metricType] : dim,
      data:            allTs.map(ts => map[ts] ?? null),
      borderColor:     color,
      backgroundColor: color + '22',
      borderWidth:     2,
      pointRadius:     allTs.length > 60 ? 0 : 3,
      pointHoverRadius:5,
      tension:         0.3,
      fill:            Object.keys(byDim).length === 1,
      spanGaps:        false,
    };
  });

  return { labels, datasets };
}

/* ── 차트 렌더링 ── */
function renderChart(rows) {
  const canvas  = document.getElementById('chart-canvas');
  const empty   = document.getElementById('chart-empty');
  const status  = document.getElementById('chart-status');

  if (!rows.length) {
    canvas.style.display = 'none';
    empty.style.display  = '';
    status.textContent   = '';
    if (chart) { chart.destroy(); chart = null; }
    return;
  }

  canvas.style.display = '';
  empty.style.display  = 'none';
  status.textContent   = rows.length + '개 포인트';

  const { labels, datasets } = buildDatasets(rows);

  if (chart) {
    chart.data.labels   = labels;
    chart.data.datasets = datasets;
    chart.options.scales.y.title.text = yAxisLabel();
    chart.update('none');
    return;
  }

  chart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, padding:16, font:{size:12} } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtY(ctx.parsed.y)}`
          }
        },
      },
      scales: {
        x: {
          ticks: { maxTicksLimit:12, font:{size:11}, color:'#94a3b8' },
          grid:  { color:'#f1f5f9' },
        },
        y: {
          title: { display: true, text: yAxisLabel(), font:{size:11}, color:'#94a3b8' },
          ticks: { callback: v => fmtY(v), font:{size:11}, color:'#64748b' },
          grid:  { color:'#f1f5f9' },
          beginAtZero: true,
        },
      },
    },
  });
}

/* ── API 호출 ── */
async function loadChart() {
  document.getElementById('chart-status').textContent = '불러오는 중...';
  document.getElementById('chart-title').textContent  = METRIC_LABELS[metricType];

  const params = new URLSearchParams({
    metric_type: metricType,
    time_range:  timeRange,
    bucket:      AUTO_BUCKET[timeRange],
    agg:         agg,
  });

  try {
    const res  = await fetch(`/api/v1/servers/${SERVER_ID}/metrics/chart?${params}`);
    const rows = await res.json();
    renderChart(rows);
  } catch (e) {
    document.getElementById('chart-status').textContent = '오류';
    console.error(e);
  }
}

/* ── 툴바 토글 ── */
function bindToggleGroup(groupId, onChange) {
  document.getElementById(groupId).addEventListener('click', e => {
    const btn = e.target.closest('.toggle');
    if (!btn) return;
    document.querySelectorAll(`#${groupId} .toggle`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    onChange(btn.dataset.val);
  });
}

bindToggleGroup('metric-btns', v => { metricType = v; if (chart) { chart.destroy(); chart = null; } loadChart(); });
bindToggleGroup('range-btns',  v => { timeRange  = v; loadChart(); });
bindToggleGroup('agg-btns',    v => { agg        = v; loadChart(); });

loadChart();
</script>
{% endblock %}
