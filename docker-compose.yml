# 루트 docker-compose.yml — prod-safe base. 빌드 없는 pull-and-run prod compose (GHCR 이미지 pull).
# prod = base + docker-compose.secrets.yml(file-secret, ADR 0046). dev = base + docker-compose.override.yml(핫리로드).
# env.example 의 COMPOSE_FILE 이 prod 에서 base+secrets 자동 머지(override 미혼입). dev 는 env.dev.example(COMPOSE_FILE 없음)이라 base+override 자동.
#
#   - 배포(prod): deploy.sh 가 배포 버전 태그에서 본 파일과 secrets overlay 를 raw fetch 한 뒤 GHCR pull.
#   - dev: override.yml 이 로컬 빌드·bind mount·hot reload. 검증 카탈로그는 루트 env.dev.example.
#
# 이미지: GHCR 정확 버전 핀. 기본값의 __ENGINE_VERSION__ 은 치환되지 않는 placeholder 라 ENGINE_IMAGE 주입이 필요하다
# — deploy.sh 가 .env 에 핀을 써 넣고, 수동 기동 시에는 운영자가 넣는다.
# 환경변수: env_file = ${ENV_FILE:-.env} (배포=env.example, dev=env.dev.example 를 .env 로 복사). secret 은 OS env > .env > changeme 보간.
# 영속 볼륨: PGDATA_HOST·MQ_DATA_HOST 주입 시 host bind(Cinder 등), 미주입 시 named volume.
# ENTRYPOINT(`python -m`, Dockerfile)라 앱 command 는 모듈명만. migrate 는 wheel 내 _alembic.ini 동적 해석($$ = compose escape).

x-app-base: &app-base
  image: ${ENGINE_IMAGE:-ghcr.io/z-converter-assessment/assessment-engine:__ENGINE_VERSION__}
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment: &app-env
    APP_ENV: ${APP_ENV:-prod}
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    # secret — 호스트 OS env 있으면 우선(override) > compose 가 읽는 .env > changeme(미설정 = prod 거부).
    # env_file 만으론 호스트 OS env override 가 안 돼(컨테이너에 .env 값 고정) 보간으로 명시. DB 컨테이너와 동일 소스라 항상 일치.
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme}
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg16  # TimescaleDB
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # 127.0.0.1 바인딩 — VM-로컬 ops 접근만(psql). 고객사 네트워크 미노출. 앱 컨테이너는 docker 네트워크로 접근.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # timescaledb-ha 실제 PGDATA 는 /home/postgres/pgdata/data. PGDATA_HOST 주입 시 host bind(Cinder),
      # 미주입 시 named volume(postgres_data). infra 는 PGDATA_HOST=/mnt/pgdata 주입.
      - ${PGDATA_HOST:-postgres_data}:/home/postgres/pgdata/data
    healthcheck:
      # -h 127.0.0.1 로 TCP 도달성 강제 (소켓 전용 부트스트랩 구간의 false-positive healthy 회피).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-assessment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      # 5672 는 외부 호스트의 agent 가 broker 로 메트릭·결과를 발행하는 통로 — 노출 필수(0.0.0.0).
      - "${RABBITMQ_PORT:-5672}:5672"
      # 15672 관리 UI 는 ops 전용 — 127.0.0.1 바인딩(VM-로컬/SSH 터널만, 고객사 네트워크 미노출).
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # MQ_DATA_HOST 주입 시 host bind(Cinder /mnt/mqdata), 미주입 시 named volume(rabbitmq_data).
      - ${MQ_DATA_HOST:-rabbitmq_data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    ports:
      # 127.0.0.1 바인딩 — Redis 무인증이라 네트워크 노출 금지(VM-로컬만). 앱 컨테이너는 docker 네트워크로 접근.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 마이그레이션 1회성(init-container 패턴) — postgres healthy 후 alembic upgrade head 실행 후 종료.
  # 이미지 ENTRYPOINT(`python -m`)를 그대로 써서 `docker compose run --rm migrate alembic history` 처럼
  # 명령만 바꿔 실행할 수 있다. 설정 경로는 이미지의 ALEMBIC_CONFIG 가 들고 있어 각 명령에 -c 를 붙이지 않는다.
  migrate:
    image: ${ENGINE_IMAGE:-ghcr.io/z-converter-assessment/assessment-engine:__ENGINE_VERSION__}
    command: ["alembic", "upgrade", "head"]
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: ["assessment_engine.web"]
    environment:
      <<: *app-env
      # prod 기본 false (bind mount 없는 이미지 배포에선 auto-reload 무의미). dev 는 override.yml 이 true.
      WEB_RELOAD: ${WEB_RELOAD:-false}
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    # ENTRYPOINT(python -m) + command 모듈명 -> `python -m assessment_engine.consumer`. dev hot-reload(watchfiles)는 override.yml.
    command: ["assessment_engine.consumer"]

  # 전용 백그라운드 워커 — 비동기 보고서 생성 + install task reaper (web=HTTP 전담에서 분리).
  # broker 미사용(DB job-claim 만) — depends_on 은 app-base(postgres·redis·rabbitmq·migrate) 그대로. dev hot-reload 는 override.yml.
  worker:
    <<: *app-base
    command: ["assessment_engine.worker"]

volumes:
  postgres_data:
  rabbitmq_data:
