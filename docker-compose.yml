# 절차가 아니라 원하는 최종 상태를 선언한다 — `docker compose up` 이 선언과 실제를 비교해 차이만큼만
# 수렴시키므로 반복 실행에 대해서 멱등하다. 기동 순서도 직접 쓰지 않고 depends_on 제약으로 유도한다.

# 컨테이너 로그는 기본 드라이버의 경우, 무제한으로 쌓아 장기 가동 호스트의 디스크를 채운다.
# 로그파일 정책을 설정해 디스크를 보호한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  # 배포 버전 핀 — `deploy.sh vX.Y.Z` 가 .env 의 이 줄을 쓴다. 비어 있으면 파싱 단계에서 멈춘다.
  image: ${ENGINE_IMAGE:-}
  restart: unless-stopped
  logging: *default-logging
  env_file: ${ENV_FILE:-.env}
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    logging: *default-logging
    image: timescale/timescaledb-ha:pg16
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - ${PGDATA_HOST:-postgres_data}:/home/postgres/pgdata/data
    healthcheck:
      # -h 127.0.0.1 로 TCP 도달성 강제 (소켓 전용 부트스트랩 구간의 false-positive healthy 회피).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    logging: *default-logging
    image: rabbitmq:3.13-management-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-assessment}
    ports:
      # agent 가 고객사 네트워크에서 발행하는 통로라 전체 인터페이스에 연다.
      - "${RABBITMQ_PUBLISH_PORT:-5672}:5672"
      # 관리 UI 는 운영자 전용 — 루프백만.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PUBLISH_PORT:-15672}:15672"
    volumes:
      - ${MQ_DATA_HOST:-rabbitmq_data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-volatile-lru}"]
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    image: ${ENGINE_IMAGE:-}
    # 설정 경로는 이미지의 ALEMBIC_CONFIG 가 들고 있어 -c 를 붙이지 않는다.
    command: ["python", "-m", "alembic", "upgrade", "head"]
    logging: *default-logging
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.web"]
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:${WEB_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEB_PORT:-8000}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.consumer"]
    # in-flight drain 예산(_SHUTDOWN_DRAIN_SEC, 5s)보다 길어야 SIGKILL 이 정리를 자르지 않는다.
    stop_grace_period: 15s

  worker:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.worker"]
    # 보고서 drain timeout(report_worker_shutdown_timeout_sec, 기본 10s)보다 길어야 SIGKILL 이 정리를 자르지 않는다.
    stop_grace_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
