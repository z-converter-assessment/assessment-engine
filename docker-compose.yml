# 루트 docker-compose.yml — prod-safe base. 빌드 없는 pull-and-run prod compose (GHCR 이미지 pull).
# `docker compose up` 은 본 파일 + docker-compose.override.yml(dev) 을 자동 머지(override 우선).
# 배포는 base 단독으로 동작 — 릴리즈는 base 만 첨부(override 미포함).
#
#   - 배포(prod): 릴리즈 첨부 base + env.example 받아 secret·ENGINE_IMAGE·PGDATA_HOST·OLLAMA_* 주입 후 GHCR pull.
#   - dev: override.yml 이 로컬 빌드·bind mount·hot reload. 검증 카탈로그는 dev/.env.example (dev-up.sh).
#
# 이미지: GHCR 정확 버전 핀. __ENGINE_VERSION__ 은 release CI 가 태그 semver 로 치환 — 소스에서 base 단독 기동 시 ENGINE_IMAGE 주입.
# 환경변수: env_file = ${ENV_FILE:-.env} (배포=루트 .env, dev=dev/.env). secret 은 OS env > .env > changeme 보간.
# 영속 볼륨: PGDATA_HOST·MQ_DATA_HOST 주입 시 host bind(Cinder 등), 미주입 시 named volume.
# ENTRYPOINT(`python -m`, Dockerfile)라 앱 command 는 모듈명만. migrate 는 wheel 내 _alembic.ini 동적 해석($$ = compose escape).

x-app-base: &app-base
  image: ${ENGINE_IMAGE:-ghcr.io/z-converter-assessment/assessment-engine:__ENGINE_VERSION__}
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment: &app-env
    APP_ENV: ${APP_ENV:-prod}
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    # secret — 호스트 OS env 있으면 우선(override) > compose 가 읽는 .env > changeme(미설정 = prod 거부).
    # env_file 만으론 호스트 OS env override 가 안 돼(컨테이너에 .env 값 고정) 보간으로 명시. DB 컨테이너와 동일 소스라 항상 일치.
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme}
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg16  # TimescaleDB + pgvector
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # timescaledb-ha 실제 PGDATA 는 /home/postgres/pgdata/data. PGDATA_HOST 주입 시 host bind(Cinder),
      # 미주입 시 named volume(postgres_data). infra 는 PGDATA_HOST=/mnt/pgdata 주입.
      - ${PGDATA_HOST:-postgres_data}:/home/postgres/pgdata/data
    healthcheck:
      # -h 127.0.0.1 로 TCP 도달성 강제 (소켓 전용 부트스트랩 구간의 false-positive healthy 회피).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/assessment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      # 5672 는 dev 파이프라인 VM(libvirt) 이 host 게이트웨이 경유로 발행하는 통로 — 노출 필수.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # MQ_DATA_HOST 주입 시 host bind(Cinder /mnt/mqdata), 미주입 시 named volume(rabbitmq_data).
      - ${MQ_DATA_HOST:-rabbitmq_data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 마이그레이션 1회성(init-container 패턴) — postgres healthy 후 alembic upgrade head 실행 후 종료.
  # prod 이미지는 wheel install 이라 alembic.ini 가 패키지 안 `_alembic.ini`. 경로를 동적 해석해 실행.
  # ENTRYPOINT 가 `python -m` 이라 entrypoint 를 sh 로 override. dev 의 migrations bind mount 는 override.yml.
  migrate:
    image: ${ENGINE_IMAGE:-ghcr.io/z-converter-assessment/assessment-engine:__ENGINE_VERSION__}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python -m alembic -c "$$(python -c 'from importlib.resources import files; print(files("assessment_engine") / "_alembic.ini")')" upgrade head
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: ["assessment_engine.web"]
    environment:
      <<: *app-env
      # prod 기본 false (bind mount 없는 이미지 배포에선 auto-reload 무의미). dev 는 override.yml 이 true.
      WEB_RELOAD: ${WEB_RELOAD:-false}
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    # ENTRYPOINT(python -m) + command 모듈명 -> `python -m assessment_engine.consumer`. dev hot-reload(watchfiles)는 override.yml.
    command: ["assessment_engine.consumer"]

  # 진단 워커 — RabbitMQ diagnostic.request 소비, 보고서 narrative 합성(LLM), DB 저장.
  diagnostic-worker:
    <<: *app-base
    command: ["assessment_engine.diagnostic"]
    environment:
      <<: *app-env
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}

  # PostgreSQL 웹 관리 UI — pgAdmin4 (servers.json 내장 GHCR 이미지, build 없는 pull). prod DB 조회·관리.
  # 접속: http://<host>:${PGADMIN_PORT:-5050} → 로그인 PGADMIN_DEFAULT_EMAIL/PASSWORD.
  # 이미지에 못 박힌 servers.json 으로 'assessment' 서버(Host=postgres)가 첫 부팅 시 트리에 자동 등록(bind mount 0).
  # prod 는 PassFile 없어 첫 연결 시 DB 비번 1회 입력(DB 비번 pgAdmin 미보관). dev override 는 /pgpass 로 무입력.
  # DB 웹 접근은 민감 — prod 외부 노출 시 ingress 인증·방화벽 뒤 배치 권장. PGADMIN_PASSWORD 는 강 secret 주입.
  pgadmin:
    image: ghcr.io/z-converter-assessment/assessment-pgadmin:__ENGINE_VERSION__
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-assessment@zconverter.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:
