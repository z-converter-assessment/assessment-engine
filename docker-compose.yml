# 루트 docker-compose.yml — dev·퀵스타트 단일 compose (ADR 0033).
#
# 한 파일로 둘 다 커버 (현 단계는 분리 안 함 — 추후 hardened prod 분리):
#   - 퀵스타트(운영): repo clone 후 `cp .env.example .env && docker compose up -d`
#   - dev 파이프라인: dev/dev-up.sh 가 본 파일을 COMPOSE_FILE 로 사용 (+ libvirt VM 등 host 구성)
#
# 이미지: 루트 Dockerfile(wheel install). app-base 가 host src 를 컨테이너 site-packages 에 bind mount 해
#   코드 수정이 컨테이너 restart(docker compose restart web)만으로 반영 — 재빌드는 의존성 변경 시에만.
# 환경변수: env_file = ${ENV_FILE:-.env}. 퀵스타트는 루트 `.env`(`cp .env.example .env`), dev 파이프라인은
#   dev-up.sh 가 `ENV_FILE=dev/.env` export 해 dev 카탈로그(dev/.env) 인식. APP_ENV 토글(기본 dev).
#   hardened prod(APP_ENV=prod + 강 secret + LOG_FORMAT=json)는 추후 분리 (ADR 0033 "추후 분리").
#
# ENTRYPOINT 가 `python -m`(루트 Dockerfile)이라 앱 command 는 모듈명만. migrate 는 wheel 안 _alembic.ini
# 경로를 동적 해석해 실행($$ = compose escape).

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # hatch-vcs(ADR 0030) 버전 주입 — .git 이 build context 에서 제외되므로 host 가 구한 값 전달.
      APP_VERSION: ${APP_VERSION:-0.0.0}
  image: ${ENGINE_IMAGE:-assessment-engine:local}
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment: &app-env
    APP_ENV: ${APP_ENV:-dev}
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  # dev 편의 — host src 를 컨테이너 site-packages 에 bind mount. 코드 수정이 컨테이너 restart 만으로 반영(재빌드 불필요).
  # 라이브러리 의존성(pyproject) 변경 시에만 재빌드 필요. (python 버전 경로는 Dockerfile python 과 일치 유지.)
  volumes:
    - ./src/assessment_engine:/usr/local/lib/python3.12/site-packages/assessment_engine

services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg16  # TimescaleDB + pgvector (ADR 0024)
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # timescaledb-ha 실제 PGDATA 는 /home/postgres/pgdata/data — 명명 볼륨을 여기 마운트해야 영속.
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      # -h 127.0.0.1 로 TCP 도달성 강제 (소켓 전용 부트스트랩 구간의 false-positive healthy 회피).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/assessment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-assessment}
    ports:
      # 5672 는 dev 파이프라인 VM(libvirt) 이 host 게이트웨이 경유로 발행하는 통로 — 노출 필수.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 마이그레이션 1회성(init-container 패턴) — postgres healthy 후 alembic upgrade head 실행 후 종료.
  # prod 이미지는 wheel install 이라 alembic.ini 가 패키지 안 `_alembic.ini`. 경로를 동적 해석해 실행.
  # ENTRYPOINT 가 `python -m` 이라 entrypoint 를 sh 로 override.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${ENGINE_IMAGE:-assessment-engine:local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python -m alembic -c "$$(python -c 'from importlib.resources import files; print(files("assessment_engine") / "_alembic.ini")')" upgrade head
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: ["assessment_engine.web"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    command: ["assessment_engine.consumer"]

  # 진단 워커 — RabbitMQ diagnostic.request 소비, 보고서 narrative 합성(LLM), DB 저장.
  # LLM(ollama)은 본 compose 미포함 — OLLAMA_BASE_URL 좌표 주입 시 동작, 미주입이면 narrative pending.
  diagnostic-worker:
    <<: *app-base
    command: ["assessment_engine.diagnostic"]
    environment:
      <<: *app-env
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}

volumes:
  postgres_data:
  rabbitmq_data:
