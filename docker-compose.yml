# 환경 무관 baseline. 단독 기동은 의도적으로 불완전 — password·외부 포트 노출은
# override(dev) 또는 docker-compose.prod.yml(prod)에서 추가한다.
#
# - dev: `docker compose up`  (override.yml 자동 적용)
# - prod: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`

services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      # POSTGRES_PASSWORD / POSTGRES_PASSWORD_FILE: override / prod 파일에서 주입
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/assessment}
      # RABBITMQ_DEFAULT_PASS / _FILE: override / prod 파일에서 주입
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build: .
    command: python -m assessment_engine.web
    expose:
      - "8000"   # 컨테이너 간만. 외부 노출은 override / prod.
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    restart: unless-stopped
    build: .
    command: python -m assessment_engine.consumer
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data: