# 환경 무관 baseline. 단독 기동은 의도적으로 불완전 — password·외부 포트 노출은
# override(dev) 또는 docker-compose.prod.yml(prod)에서 추가한다.
#
# - dev: `docker compose up`  (override.yml 자동 적용)
# - prod: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`

# YAML anchor — 앱 4종(web/consumer/diagnostic-worker/diagnostic-scheduler)이 공유하는
# build / depends_on / 공통 environment를 단일 진실로 정의. 신규 앱 서비스 추가 시 anchor만 참조.
x-app-base: &app-base
  build: .
  restart: unless-stopped
  environment: &app-env
    APP_ENV: ${APP_ENV:-prod}
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      # POSTGRES_PASSWORD / POSTGRES_PASSWORD_FILE: override / prod 파일에서 주입
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/assessment}
      # RABBITMQ_DEFAULT_PASS / _FILE: override / prod 파일에서 주입
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 마이그레이션 1회성 작업 (init-container 패턴) — postgres healthy 후 alembic upgrade head 실행하고 종료.
  # 모든 앱 서비스는 본 컨테이너 완료 후에만 기동 (depends_on: service_completed_successfully).
  # schema는 dev·staging·prod 모두 Alembic 단일 진실. lifespan의 create_all 자동 분기 제거됨.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: python -m assessment_engine.web
    expose:
      - "8000"   # 단일 port — HTTPS(cert 주입 시) 또는 plain HTTP(외부 ingress 종단 prod).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    command: python -m assessment_engine.consumer

  # AI 진단 워커 — RabbitMQ `diagnostic.request` 소비, LLM 호출, DB 저장 (ADR 0004).
  # LLM_PROVIDER 기본 mock (과금 발생 외부 API 호출 금지 — 운영자 정책).
  diagnostic-worker:
    <<: *app-base
    command: python -m assessment_engine.diagnostic
    environment:
      <<: *app-env
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}

  # AI 진단 스케줄러 — cron 발화로 활성 서버 N대 + environment job enqueue + retention DELETE.
  diagnostic-scheduler:
    <<: *app-base
    command: python -m assessment_engine.diagnostic.scheduler

volumes:
  postgres_data:
