
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  image: ${ENGINE_IMAGE:-}
  restart: unless-stopped
  logging: *default-logging
  env_file: ${ENV_FILE:-.env}
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    logging: *default-logging
    image: timescale/timescaledb-ha:pg16
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - ${PGDATA_HOST:-postgres_data}:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    logging: *default-logging
    image: rabbitmq:3.13-management-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-assessment}
    ports:
      - "${RABBITMQ_PUBLISH_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PUBLISH_PORT:-15672}:15672"
    volumes:
      - ${MQ_DATA_HOST:-rabbitmq_data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-volatile-lru}"]
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    image: ${ENGINE_IMAGE:-}
    command: ["python", "-m", "assessment_engine.migrate", "upgrade", "head"]
    logging: *default-logging
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.web"]
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:${WEB_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEB_PORT:-8000}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.consumer"]
    stop_grace_period: 15s

  worker:
    <<: *app-base
    command: ["python", "-m", "assessment_engine.worker"]
    stop_grace_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
