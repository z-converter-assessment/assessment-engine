# app-server-01: Ubuntu 24.04 LTS (noble) + docker.io.
# 검증 의도: container 카테고리 뱃지 + apt 최신 LTS major (22.04/20.04와 다른 GLIBC) +
#            swap_used trigger로 right-sizing under_provisioned 안정 발화 (호스트 CPU 부담 최소화).
# RPM family는 podman default + docker-ce 외부 repo 필요라 apt family 선택.
#
# under 발화 전략:
#   - heavy++ CPU sustained 50~58s (host CPU 1 core 83% 점유)는 호스트 thermal 부담 큼.
#   - 대신 swap file 256MB 활성화 + boot 직후 1회 mem burst 1100MB로 swap 강제 발화.
#   - SwapUsed > 0 영구 유지 (OS가 자동 swapoff 안 함) → recommendation.classify가
#     swap_used short-circuit으로 under_provisioned 즉시 발화.
#   - 합성 부하 timer는 light 패턴 (cpu 1~3s, mem 5~20MB)으로 호스트 부담 light 수준 유지.
#
# yaml 책임: boot + mount + swap 활성화 + boot-time swap trigger + 합성 부하 timer (light).
# 패키지 설치(docker.io)·에이전트 빌드·systemd unit은 dev-up.sh post-provision.

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

cpus: 1
# docker 데몬 ~100MB + apt install transaction + swap-trigger boot burst 1100MB.
# 1280MiB 보수 — swap file 256MB가 OOM 회피 안전 마진.
memory: "1280MiB"
disk: "5GiB"

containerd:
  system: false
  user: false

param:
  AgentSrc: ""

mounts:
- location: "{{.Param.AgentSrc}}"
  mountPoint: "/mnt/agent-src"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    # Step 1: swap file 256MB 활성화 — boot-time swap trigger의 backing store.
    set -euo pipefail
    if [ ! -f /swapfile ]; then
      fallocate -l 256M /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi

    # Step 2: boot-time swap trigger — 부팅 후 1회 1100MB mem burst로 swap 강제 발화.
    # idempotent: SwapUsed > 0이면 skip (이미 발화됨).
    # systemd oneshot Type — multi-user.target 도달 후 1회 실행.
    cat > /usr/local/bin/swap-trigger.sh <<'EOF'
    #!/bin/bash
    # 이미 swap 사용 중이면 skip (재기동 시 중복 burst 회피)
    swap_used_kb=$(grep ^SwapTotal /proc/meminfo | awk '{print $2}')
    swap_free_kb=$(grep ^SwapFree /proc/meminfo | awk '{print $2}')
    swap_used=$(( swap_used_kb - swap_free_kb ))
    if [ "$swap_used" -gt 0 ]; then
      logger "swap-trigger skip: SwapUsed=${swap_used}KB > 0"
      exit 0
    fi
    # 1100MB burst → kernel이 anonymous page를 swap에 push (vm.swappiness=60 default)
    # burst 후 free되어도 swap에 push된 page는 그대로 남음 → SwapUsed > 0 영구
    head -c 1100M /dev/urandom > /tmp/swap-trigger-burst 2>/dev/null || true
    sleep 10
    rm -f /tmp/swap-trigger-burst
    sync
    logger "swap-trigger fired: SwapUsed now $(awk '/SwapTotal/{t=$2}/SwapFree/{f=$2}END{print t-f}' /proc/meminfo)KB"
    EOF
    chmod 755 /usr/local/bin/swap-trigger.sh
    cat > /etc/systemd/system/swap-trigger.service <<'EOF'
    [Unit]
    Description=Boot-time swap trigger (under_provisioned 안정 발화)
    After=multi-user.target
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/swap-trigger.sh
    [Install]
    WantedBy=multi-user.target
    EOF

    # Step 3: 합성 부하 (light) — host 부담 최소. swap_used가 under 분류를 책임지므로
    # CPU·mem 부하는 light 수준으로 충분 (다른 light VM과 동일 패턴).
    cat > /usr/local/bin/synthetic-load.sh <<'EOF'
    #!/bin/bash
    sleep $(( RANDOM % 30 ))
    duration=$(( (RANDOM % 3) + 1 ))
    timeout ${duration}s sha256sum /dev/zero > /dev/null 2>&1 || true
    size=$(( (RANDOM % 16) + 5 ))
    head -c ${size}M /dev/urandom > /tmp/synthetic-load 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-load
    count=$(( (RANDOM % 100) + 50 ))
    dd if=/dev/zero of=/tmp/synthetic-io bs=4k count=${count} 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-io
    ping -c $(( (RANDOM % 5) + 3 )) -q host.lima.internal > /dev/null 2>&1 || true
    curl -s -m 2 http://host.lima.internal:8000/health > /dev/null 2>&1 || true
    if [ $((RANDOM % 2)) -eq 0 ]; then
      curl -s -m 2 http://host.lima.internal:8000/static/js/chart-utils.js > /dev/null 2>&1 || true
    fi
    EOF
    chmod 755 /usr/local/bin/synthetic-load.sh
    cat > /etc/systemd/system/synthetic-load.service <<'EOF'
    [Unit]
    Description=Synthetic load (metrics visualization aid)
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/synthetic-load.sh
    EOF
    cat > /etc/systemd/system/synthetic-load.timer <<'EOF'
    [Unit]
    Description=Run synthetic-load every minute
    [Timer]
    OnBootSec=2min
    OnUnitActiveSec=1min
    [Install]
    WantedBy=timers.target
    EOF

    systemctl daemon-reload
    systemctl enable swap-trigger.service
    systemctl start swap-trigger.service
    systemctl enable synthetic-load.timer
    systemctl start synthetic-load.timer

message: |
  app-server-01 (Ubuntu 24.04 LTS + docker.io, swap_used trigger for under_provisioned) ready.
  Agent install pending — run dev-up.sh post-provision step.
