# mq-server-01: Debian 12 + Mosquitto (MQTT — 가장 가벼운 MQ).
# 검증 의도: mq 카테고리 뱃지 (mosquitto 키워드) + over 분류 (light 부하).
# 1차 후보 openSUSE Leap 15 → zypper install 시 `Retrieving: ...[.not found]` (mirror 풀 일부가
# 메타데이터 갱신 후 .rpm 파일 sync 안 됨, 매번 통과 보장 없음) + boot 직후 cloud-init이 zypper hold
# (사고 #14) + virtiofs guest mount silent fail (사고 #2)까지 누적 3중 불안정 → 안정 distro로 fallback.
# 사고 #15 — 사용자 결정으로 OS 다양성(zypper family 검증)보다 프로비저닝 안정성 우선.
# 2차 Debian 12 — cloud.debian.org mirror infra 광범위 + virtiofs default OK + apt 분기 재사용.
#
# yaml 책임: boot + mount + 합성 부하 timer (light).
# 패키지 설치(mosquitto)·에이전트 빌드·systemd unit은 dev-up.sh post-provision (apt 분기).

images:
- location: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
  arch: "x86_64"
- location: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-arm64.qcow2"
  arch: "aarch64"

cpus: 1
# Debian 12 minimal cloud image — apt install mosquitto 가벼움. web-server-01과 동일 사양.
memory: "512MiB"
disk: "5GiB"

containerd:
  system: false
  user: false

param:
  AgentSrc: ""

mounts:
- location: "{{.Param.AgentSrc}}"
  mountPoint: "/mnt/agent-src"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    # 합성 부하 (light) — cache·db와 동일 패턴. over_provisioned 분류 발화.
    set -euo pipefail
    cat > /usr/local/bin/synthetic-load.sh <<'EOF'
    #!/bin/bash
    sleep $(( RANDOM % 30 ))
    duration=$(( (RANDOM % 3) + 1 ))
    timeout ${duration}s sha256sum /dev/zero > /dev/null 2>&1 || true
    size=$(( (RANDOM % 16) + 5 ))
    head -c ${size}M /dev/urandom > /tmp/synthetic-load 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-load
    count=$(( (RANDOM % 100) + 50 ))
    dd if=/dev/zero of=/tmp/synthetic-io bs=4k count=${count} 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-io
    ping -c $(( (RANDOM % 5) + 3 )) -q host.lima.internal > /dev/null 2>&1 || true
    curl -s -m 2 http://host.lima.internal:8000/health > /dev/null 2>&1 || true
    if [ $((RANDOM % 2)) -eq 0 ]; then
      curl -s -m 2 http://host.lima.internal:8000/static/js/chart-utils.js > /dev/null 2>&1 || true
    fi
    EOF
    chmod 755 /usr/local/bin/synthetic-load.sh
    cat > /etc/systemd/system/synthetic-load.service <<'EOF'
    [Unit]
    Description=Synthetic load (metrics visualization aid)
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/synthetic-load.sh
    EOF
    cat > /etc/systemd/system/synthetic-load.timer <<'EOF'
    [Unit]
    Description=Run synthetic-load every minute
    [Timer]
    OnBootSec=2min
    OnUnitActiveSec=1min
    [Install]
    WantedBy=timers.target
    EOF
    systemctl daemon-reload
    systemctl enable synthetic-load.timer
    systemctl start synthetic-load.timer

message: |
  mq-server-01 (Debian 12 + Mosquitto, light load → over) ready.
  Agent install pending — run dev-up.sh post-provision step (apt 분기).
