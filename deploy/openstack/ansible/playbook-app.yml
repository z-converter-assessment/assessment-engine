---
# engine-app VM: Docker + 전체 코드 sync + compose up (migrate → web → consumer → diagnostic-*).
# ADR 0006 + ADR 0005 migrate init-container 패턴.

- hosts: engine-app
  become: true
  vars_files:
    - group_vars/all/vault.yml
  roles:
    - docker
  tasks:
    - name: rsync 설치 (synchronize 모듈 의존)
      apt:
        name: rsync
        state: present

    - name: 디렉토리 생성
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - /opt/assessment-engine
        - /opt/assessment-engine/deploy/openstack/compose/secrets

    - name: 전체 코드 sync (repo root → /opt/assessment-engine)
      ansible.posix.synchronize:
        src: ../../../../    # ansible/ → deploy/openstack/ → deploy/ → root
        dest: /opt/assessment-engine/
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=node_modules"
          - "--exclude=.pytest_cache"
          - "--exclude=.ruff_cache"
          - "--exclude=*.pyc"
          - "--exclude=postgres_data"
          - "--exclude=secrets"
      become: false

    - name: ownership 보정
      file:
        path: /opt/assessment-engine
        state: directory
        owner: ubuntu
        group: ubuntu
        recurse: true

    - name: postgres_password secret 파일
      copy:
        content: "{{ postgres_password }}"
        dest: /opt/assessment-engine/deploy/openstack/compose/secrets/postgres_password
        owner: ubuntu
        group: ubuntu
        mode: '0400'
      no_log: true

    - name: rabbitmq_password secret 파일
      copy:
        content: "{{ rabbitmq_password }}"
        dest: /opt/assessment-engine/deploy/openstack/compose/secrets/rabbitmq_password
        owner: ubuntu
        group: ubuntu
        mode: '0400'
      no_log: true

    - name: .env 파일 (compose interpolation 변수)
      copy:
        content: |
          APP_ENV=prod
          ENGINE_DB_HOST={{ engine_db_host }}
          ENGINE_MW_HOST={{ engine_mw_host }}
          POSTGRES_USER=assessment
          POSTGRES_DB=assessment
          RABBITMQ_USER=assessment
          RABBITMQ_VHOST=/assessment
          LLM_PROVIDER=mock
        dest: /opt/assessment-engine/deploy/openstack/compose/.env
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: docker compose build + up
      command:
        cmd: docker compose -f docker-compose.app.yml up -d --build
        chdir: /opt/assessment-engine/deploy/openstack/compose
      become_user: ubuntu

    - name: web healthy 대기
      command:
        cmd: docker compose -f docker-compose.app.yml ps --status running web
        chdir: /opt/assessment-engine/deploy/openstack/compose
      register: web_status
      retries: 30
      delay: 10
      until: "'healthy' in web_status.stdout"
      become_user: ubuntu
