# Ansible inventory 템플릿.
# `scripts/deploy.sh`가 Terraform output을 sed로 치환해 `inventory.yml`로 생성 (gitignore).
# __PLACEHOLDER__는 deploy.sh가 자동 채움.

all:
  hosts:
    engine-db:
      ansible_host: __DB_IP__
    engine-mw:
      ansible_host: __MW_IP__
    engine-app:
      ansible_host: __APP_IP__
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "{{ lookup('env', 'OPENSTACK_KEY_PATH') | default('~/.ssh/openstack-key.pem', true) }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    # 앱 VM 컨테이너에 주입할 외부 host 주소
    engine_db_host: __DB_IP__
    engine_mw_host: __MW_IP__
