---
# engine-db VM: Docker + postgres compose up (ADR 0006).

- hosts: engine-db
  become: true
  vars_files:
    - group_vars/all/vault.yml
  roles:
    - docker
  tasks:
    - name: 디렉토리 생성
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - /opt/assessment-engine
        - /opt/assessment-engine/deploy/openstack/compose
        - /opt/assessment-engine/deploy/openstack/compose/secrets

    - name: compose 파일 배포
      copy:
        src: ../compose/docker-compose.db.yml
        dest: /opt/assessment-engine/deploy/openstack/compose/docker-compose.db.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: postgres_password secret 파일
      copy:
        content: "{{ postgres_password }}"
        dest: /opt/assessment-engine/deploy/openstack/compose/secrets/postgres_password
        owner: ubuntu
        group: ubuntu
        mode: '0400'
      no_log: true

    - name: docker compose up
      command:
        cmd: docker compose -f docker-compose.db.yml up -d
        chdir: /opt/assessment-engine/deploy/openstack/compose
      become_user: ubuntu

    - name: postgres healthy 대기
      command:
        cmd: docker compose -f docker-compose.db.yml ps --status running postgres
        chdir: /opt/assessment-engine/deploy/openstack/compose
      register: postgres_status
      retries: 12
      delay: 5
      until: "'healthy' in postgres_status.stdout or 'running' in postgres_status.stdout"
      become_user: ubuntu
