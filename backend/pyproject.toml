[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "celery[rabbitmq]>=5.4.0",
    "aio-pika>=9.4.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]