# 단일 DB용 Alembic 설정. DB URL·로깅은 migrations/env.py 가 런타임 적용.

[alembic]
# %(here)s = 본 ini 위치 (cwd 무관하게 migrations/ 탐색). wheel install 시 패키지 안 _alembic.ini 도 동일 구조.
script_location = %(here)s/migrations
prepend_sys_path = .
# 경로 리스트 split 구분자 — os.pathsep (Linux ':', Windows ';').
path_separator = os
# URL 은 migrations/env.py 가 web_settings.database_url 로 런타임 주입 — 본 값 무시.
sqlalchemy.url =

[post_write_hooks]

# 로깅 — env.py 가 fileConfig 로 읽어 적용.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
