# 단일 DB용 표준 Alembic 설정.

[alembic]
# 마이그레이션 스크립트 경로.
# 보통 POSIX 형식(forward slash) 사용, %(here)s 토큰 기준의 상대 경로로 적는다.
# %(here)s = 본 ini 파일이 위치한 디렉토리 절대 경로 (alembic이 ConfigParser interpolation으로 자동 주입).
# 따라서 어디서 alembic 명령을 실행해도(cwd 무관) migrations/ 디렉토리를 올바르게 찾는다.
script_location = %(here)s/migrations

# 마이그레이션 파일명 템플릿. 기본값은 %%(rev)s_%%(slug)s.
# 날짜·시각을 파일명 앞에 붙이고 싶으면 아래 줄 주석 해제.
# 사용 가능한 토큰 전체: https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# (이중 %%는 ConfigParser에서 % 자체를 표현하는 escape — alembic이 실제로는 %(rev)s, %(slug)s 형태로 읽는다)
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# 또는 날짜 기반 하위 디렉토리로 정리 (recursive_version_locations = true 필요)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# sys.path에 prepend할 경로. 지정 시 sys.path 앞에 추가됨.
# 기본값은 현재 작업 디렉토리. 여러 경로 지정 시 구분자는 아래 "path_separator" 값을 따른다.
prepend_sys_path = .

# 마이그레이션 파일 안 날짜와 파일명에 사용할 timezone.
# 지정하려면 tzdata 라이브러리 필요 (`alembic[tz]`를 pip 의존성에 추가).
# 문자열 값은 ZoneInfo()로 그대로 전달.
# 비워두면 로컬타임 사용.
# timezone =

# "slug" 필드 최대 글자수 제한.
# truncate_slug_length = 40

# 'true'로 설정하면 autogenerate 여부와 무관하게
# 'revision' 명령 실행 시 env.py를 항상 실행.
# revision_environment = false

# 'true'로 설정하면 .py 원본 없는 .pyc / .pyo 파일도
# versions/ 디렉토리의 revision으로 인식.
# sourceless = false

# revision 파일이 저장될 위치. 기본값은 <script_location>/versions.
# 여러 version 디렉토리를 쓸 때는 초기 revision을 --version-path로 명시해야 한다.
# 구분자는 아래 "path_separator" 값을 따른다.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator — alembic.ini 안 ConfigParser 파일에서 version_locations,
# prepend_sys_path 같은 경로 리스트를 어느 문자로 split할지 결정.
#
# 신규 생성되는 alembic.ini의 기본값은 "os" — os.pathsep을 써서
# OS별 경로 구분자(Linux/macOS는 ':', Windows는 ';')를 자동 적용.
#
# legacy alembic.ini 호환을 위해, path_separator가 명시되지 않으면
# 위 기본은 적용되지 않고 아래 fallback 로직이 동작:
#
# 1. version_locations 옵션은 legacy "version_path_separator" 키를 우선 참조,
#    그것도 없으면 공백·콤마 분할(legacy 동작)로 fallback.
# 2. prepend_sys_path 옵션은 공백·콤마·콜론 분할(legacy 동작)로 fallback.
#
# 유효한 path_separator 값:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# os.pathsep 사용. 신규 프로젝트의 기본 설정.
path_separator = os


# 'true'로 설정하면 각 "version_locations" 디렉토리 안 source 파일을
# 재귀적으로 탐색.
# Alembic 1.10에서 추가됨.
# recursive_version_locations = false

# script.py.mako로부터 revision 파일을 작성할 때 사용할 출력 인코딩.
# output_encoding = utf-8

# DB URL. 본 값은 env.py 스크립트가 읽어 쓴다.
# 다른 방식으로 DB URL을 구성하려면 env.py 안에서 직접 처리 가능.
; URL은 migrations/env.py가 web_settings.database_url로 런타임 주입 — 본 값은 무시됨
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks — 새로 생성된 revision 스크립트에 자동 실행할
# 셸 스크립트 또는 Python 함수를 정의. 자세한 사용법·예시는 공식 문서 참조.

# "black"으로 포매팅 — console_scripts runner로 "black" entrypoint 실행
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# "ruff" lint + 자동 fix — module runner로 "ruff" 모듈 실행
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# 또는 PATH에서 찾을 수 있는 바이너리를 exec runner로 직접 실행
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# 로깅 설정. 본 설정도 env.py 스크립트가 읽어 적용한다.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
