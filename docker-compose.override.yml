# dev 자동 적용 override. `docker compose up` 시 base와 자동 머지.
# prod 기동(`-f docker-compose.yml -f docker-compose.prod.yml`)에는 적용되지 않는다.
#
# 핵심 차이 (base 대비):
# - .env 평문 주입 (POSTGRES_PASSWORD 등)
# - 모든 백킹 서비스 포트를 호스트로 노출 (디버깅·redis-cli 직결 등)
# - web/consumer에 코드 마운트 (volumes: ./:/app) — 빠른 반복
# - APP_ENV=dev 강제 (config.py model_validator의 prod 검증 우회)

# YAML anchor — dev 5 앱 서비스(migrate/web/consumer/diagnostic-worker/diagnostic-scheduler)가
# 공유하는 코드 마운트 + .env 주입 + APP_ENV=dev 강제. 신규 앱 서비스 추가 시 *dev-app 한 줄로 dev 호환.
#
# user: "0:0" — Dockerfile은 prod 정석으로 USER app(uid 1000)을 적용하지만, dev는 `./:/app`로 호스트 코드를
# bind mount하므로 컨테이너 uid 1000이 호스트 파일(macOS 보통 501) 쓰기 실패 가능. dev에선 root로 되돌려
# uvicorn auto-reload·__pycache__ 생성 충돌 회피. prod는 base만 적용되므로 영향 없음.
x-dev-app: &dev-app
  user: "0:0"
  volumes:
    - ./:/app
  env_file: .env
  environment:
    APP_ENV: dev

services:
  postgres:
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-assessment}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # pgAdmin — dev DB GUI. ServerMode=False → 로그인 없이 즉시 사용.
  # 서버 등록은 infra/pgadmin-servers.json으로 자동 (postgres host·user 미리 채워짐). password는 첫 접속 시 입력.
  # profiles: [gui] — 기본 `docker compose up`엔 미포함, 명시 호출 시만 띄움 (idle 250MiB 절감).
  #   띄우려면: `docker compose --profile gui up -d pgadmin`
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [gui]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com    # pgAdmin이 RFC 형식(TLD 필요) 검증 — local 도메인은 reject
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./infra/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *dev-app

  web:
    <<: *dev-app
    ports:
      - "${WEB_PORT:-8000}:8000"

  consumer:
    <<: *dev-app

  diagnostic-worker:
    <<: *dev-app

  diagnostic-scheduler:
    <<: *dev-app
