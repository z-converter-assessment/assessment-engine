
x-dev-app: &dev-app
  build:
    context: .
    dockerfile: Dockerfile
  image: assessment-engine:local
  volumes:
    - ./src:/app/src
  environment:
    PYTHONPATH: /app/src

services:
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}

  web:
    <<: *dev-app
    environment:
      PYTHONPATH: /app/src
      WEB_RELOAD: ${WEB_RELOAD:-true}

  consumer:
    <<: *dev-app
    command: ["watchfiles", "--filter", "python", "python -m assessment_engine.consumer", "/app/src/assessment_engine"]

  worker:
    <<: *dev-app
    command: ["watchfiles", "--filter", "python", "python -m assessment_engine.worker", "/app/src/assessment_engine"]

  migrate:
    <<: *dev-app
