# dev overlay — 파일명이 docker-compose.override.yml 이라 compose 가 base 에 자동으로 얹는다.
# .env 에 COMPOSE_FILE 이 있으면 그 목록이 우선하므로 배포 환경에서는 섞이지 않는다.
#
# 하는 일은 셋이다. GHCR 이미지 핀을 로컬 빌드로 덮고, 호스트 소스를 컨테이너 가상환경에 bind mount 하고,
# 코드 변경이 재빌드 없이 반영되게 한다.
#
# 앵커는 파일 스코프라 base 의 *app-base 를 여기서 못 쓴다 — dev 공통을 *dev-app 으로 다시 묶었다.
# 나머지(환경변수·command·depends_on)는 base 에서 머지된다.

x-dev-app: &dev-app
  build:
    context: .
    dockerfile: Dockerfile
  # dev 로컬 빌드 태그 — base 의 GHCR 핀을 덮어 GHCR pull 없이 로컬 이미지 사용.
  image: ${ENGINE_IMAGE:-assessment-engine:local}
  # host src 를 컨테이너 가상환경에 bind mount — 코드 수정이 컨테이너 restart 만으로 반영(의존성 변경 시에만 재빌드).
  # migrations 도 패키지 안에 있어 이 마운트 하나로 함께 덮인다.
  volumes:
    - ./src/assessment_engine:/opt/venv/lib/python3.12/site-packages/assessment_engine

services:
  web:
    <<: *dev-app
    environment:
      # base 의 APP_ENV fallback(prod)을 dev 로 덮음 (cross-file deep merge).
      APP_ENV: ${APP_ENV:-dev}
      # dev hot-reload — uvicorn auto-reload (reload_dirs=bind mount 패키지, web/__main__.py).
      WEB_RELOAD: ${WEB_RELOAD:-true}

  consumer:
    <<: *dev-app
    environment:
      APP_ENV: ${APP_ENV:-dev}
    # dev hot-reload — bind mount 패키지 .py 변경 시 watchfiles 가 프로세스 재시작 (web uvicorn reload 와 짝).
    # consumer 는 uvicorn 이 아니라 watchfiles 래퍼로 reload (base 의 entrypoint=python -m override).
    entrypoint: ["watchfiles", "--filter", "python"]
    command: ["python -m assessment_engine.consumer", "/opt/venv/lib/python3.12/site-packages/assessment_engine"]

  worker:
    <<: *dev-app
    environment:
      APP_ENV: ${APP_ENV:-dev}
    # dev hot-reload — consumer 와 동일 watchfiles 래퍼(uvicorn 아님).
    entrypoint: ["watchfiles", "--filter", "python"]
    command: ["python -m assessment_engine.worker", "/opt/venv/lib/python3.12/site-packages/assessment_engine"]

  # 마이그레이션 — base 의 alembic entrypoint·command 유지. dev 는 build + bind mount 만 더한다
  # (새 revision 을 재빌드 없이 인식).
  migrate:
    <<: *dev-app
    environment:
      APP_ENV: ${APP_ENV:-dev}
