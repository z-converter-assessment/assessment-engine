# db-server-01: AlmaLinux 9 + PostgreSQL + swap-trigger.
# 검증 의도: db 카테고리 + RHEL 9 1:1 클론 distro + RPM family postgresql 운영 (postgresql-setup --initdb 수동 init 단계 검증).
# swap-trigger -> attention.under_provisioned 발화 (swap_used 임계 초과).
# 1차 Debian 11 → boot stuck. 2차 Ubuntu 20.04 → apt 회귀만 검증되고 RPM postgresql 분기 dead code.
# 3차 AlmaLinux 9 (offline 자리와 db 위치 교체) — RPM family postgresql 분기 활성화 + OpenStack OSP 환경 정합.
#
# yaml 책임: boot + mount + 합성 부하 timer (light) + swap-trigger oneshot.
# 패키지 설치(postgresql-server)·systemd unit은 pipeline-up.sh post-provision (almalinux:postgres 분기 재사용).

images:
- location: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
  arch: "x86_64"
- location: "https://repo.almalinux.org/almalinux/9/cloud/aarch64/images/AlmaLinux-9-GenericCloud-latest.aarch64.qcow2"
  arch: "aarch64"

cpus: 1
# AlmaLinux 9 dnf transaction 보수 1.25 GiB (monitor-server-01·cache-server-01 Rocky 9와 동일 RHEL 9 family).
memory: "1280MiB"
# AlmaLinux 9 cloud image qcow2 raw가 10 GiB 강제 (RPM family 동일).
disk: "10GiB"

containerd:
  system: false
  user: false

param:
  AgentBinDir: ""

mounts:
- location: "{{.Param.AgentBinDir}}"
  mountPoint: "/mnt/agent-bin"
  writable: false

provision:
- mode: system
  script: |
    #!/bin/bash
    # 합성 부하 (light) — cache·web과 동일.
    set -euo pipefail
    cat > /usr/local/bin/synthetic-load.sh <<'EOF'
    #!/bin/bash
    sleep $(( RANDOM % 30 ))
    duration=$(( (RANDOM % 3) + 1 ))
    timeout ${duration}s sha256sum /dev/zero > /dev/null 2>&1 || true
    size=$(( (RANDOM % 16) + 5 ))
    head -c ${size}M /dev/urandom > /tmp/synthetic-load 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-load
    count=$(( (RANDOM % 100) + 50 ))
    dd if=/dev/zero of=/tmp/synthetic-io bs=4k count=${count} 2>/dev/null || true
    sync
    rm -f /tmp/synthetic-io
    ping -c $(( (RANDOM % 5) + 3 )) -q host.lima.internal > /dev/null 2>&1 || true
    curl -s -m 2 http://host.lima.internal:8000/health > /dev/null 2>&1 || true
    if [ $((RANDOM % 2)) -eq 0 ]; then
      curl -s -m 2 http://host.lima.internal:8000/static/js/chart-utils.js > /dev/null 2>&1 || true
    fi
    EOF
    chmod 755 /usr/local/bin/synthetic-load.sh
    cat > /etc/systemd/system/synthetic-load.service <<'EOF'
    [Unit]
    Description=Synthetic load (metrics visualization aid)
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/synthetic-load.sh
    EOF
    cat > /etc/systemd/system/synthetic-load.timer <<'EOF'
    [Unit]
    Description=Run synthetic-load every minute
    [Timer]
    OnBootSec=2min
    OnUnitActiveSec=1min
    [Install]
    WantedBy=timers.target
    EOF
    systemctl daemon-reload
    systemctl enable synthetic-load.timer
    systemctl start synthetic-load.timer

# attention.under_provisioned 시연용 — boot-time 1회 swap 활성 + 메모리 압박으로 swap_used 발생.
# CPU 부하 추가 없음 (호스트 영향 회피). swap_used 임계만 넘기면 분류 발화.
- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    cat > /usr/local/bin/swap-trigger.sh <<'EOF'
    #!/bin/bash
    # 1) swap 파일 생성·활성 (cloud image default 에는 swap 없음).
    if ! swapon --show | grep -q '^/swapfile'; then
      fallocate -l 512M /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=512
      chmod 600 /swapfile
      mkswap /swapfile > /dev/null
      swapon /swapfile
    fi
    # 2) swappiness 높여 kernel 이 swap 적극 사용하게.
    sysctl -w vm.swappiness=100 > /dev/null
    # 3) 메모리 압박 — VM 1280MiB 중 1000MiB 점유 + lock (RAM 부족 → swap out).
    nohup bash -c 'head -c 1000M /dev/urandom > /tmp/swap-pressure 2>/dev/null; sleep 86400' &
    EOF
    chmod 755 /usr/local/bin/swap-trigger.sh
    cat > /etc/systemd/system/swap-trigger.service <<'EOF'
    [Unit]
    Description=Swap trigger (attention.under_provisioned 시연용)
    After=multi-user.target
    [Service]
    Type=oneshot
    RemainAfterExit=true
    ExecStart=/usr/local/bin/swap-trigger.sh
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable swap-trigger.service
    systemctl start swap-trigger.service

message: |
  db-server-01 (AlmaLinux 9 + PostgreSQL) ready.
  Agent install pending — run pipeline-up.sh post-provision step (almalinux:postgres 분기 + postgresql-setup --initdb 자동).
  swap-trigger.service enabled — attention.under_provisioned 발화 시연용.
