# dev 기능 개발용 compose (#A0). prod 운영은 본 repo 범위 밖 (ADR 0012).
# 외부 인프라가 wheel + systemd 또는 자체 컨테이너 오케스트레이션으로 자체 구성.
#
# 기동 (본 디렉토리에서):  `docker compose up`
# 또는 (루트에서):           `docker compose -f dev/docker-compose.yml up`
#
# 경로 규약 (본 파일이 dev/ 안에 있음 — 루트 산출물 분리 정공):
#   - build context = `..` (루트, Dockerfile 위치)
#   - volume mount  = `../:/app` (호스트 루트 ↔ 컨테이너 /app)
#   - env_file       = `.env` (dev/.env — `cp dev/.env.example dev/.env`)
#
# YAML anchor — 앱 4종 (migrate · web · consumer · diagnostic-worker)이
# 공유하는 build · depends_on · dev volume mount · 공통 environment를 단일 진실로 정의.
# ADR 0023: scheduler cron 폐기로 5종 → 4종.
#
# user "0:0" — Dockerfile 의 USER app(uid 1000) 적용. dev 는 `../:/app` 으로 호스트 코드 bind
# mount 이라 컨테이너 uid 1000 이 호스트 파일(macOS 보통 501) 쓰기 실패 가능. dev 에선 root
# 되돌려 uvicorn auto-reload · __pycache__ 생성 충돌 회피.
x-app-base: &app-base
  build:
    context: ..
    dockerfile: dev/Dockerfile
  restart: unless-stopped
  user: "0:0"
  volumes:
    - ../:/app
  env_file: .env
  environment: &app-env
    APP_ENV: ${APP_ENV:-dev}
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    restart: unless-stopped
    # ADR 0024: pgvector extension 의무 — `timescaledb-ha` 변형 (TimescaleDB + pgvector + postgis 등 all-in-one 포함).
    image: timescale/timescaledb-ha:pg16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assessment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assessment}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/assessment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-assessment}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 마이그레이션 1회성 작업 (init-container 패턴) — postgres healthy 후 alembic upgrade head 실행하고 종료.
  # 모든 앱 서비스는 본 컨테이너 완료 후에만 기동 (depends_on: service_completed_successfully).
  # schema는 Alembic 단일 진실 (ADR 0005). lifespan의 create_all 자동 분기 제거됨.
  migrate:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    command: alembic upgrade head
    user: "0:0"
    volumes:
      - ../:/app
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    command: python -m assessment_engine.web
    ports:
      - "${WEB_PORT:-8000}:8000"   # dev plain HTTP
    # ADR 0018 dev ZDM mock self-loop — HttpZdmPackageResolver 가 publish 직전
    # `host.lima.internal:8000` 으로 HEAD/GET 호출. Lima VM 의 user-mode alias 와 같은
    # 이름을 web 컨테이너 안에서도 Mac host gateway 로 해석 → port 매핑 → web 자기 자신.
    # 양쪽 (web 컨테이너 + Lima VM agent) 이 동일 좌표로 동일 endpoint 도달 (dev 전용).
    extra_hosts:
      - "host.lima.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *app-base
    command: python -m assessment_engine.consumer

  # 진단 워커 — RabbitMQ `diagnostic.request` 소비, 규칙 기반 진단 수행, DB 저장 (ADR 0004 · 0010 · 0023).
  # LLM_PROVIDER 기본 mock (과금 발생 외부 API 호출 금지 — 운영자 정책).
  # ADR 0023: scheduler cron 폐기. trigger 채널 = web POST /api/diagnostics 만.
  diagnostic-worker:
    <<: *app-base
    command: python -m assessment_engine.diagnostic
    environment:
      <<: *app-env
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}

volumes:
  postgres_data:
  rabbitmq_data:
