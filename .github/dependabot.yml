version: 2

# uv/pip 생태계는 넣지 않는다 — Dependabot 이 `uv.lock` 을 갱신하지 못해 `pyproject.toml` 만 바뀐 PR 이
# 열리고, 그 PR 은 `uv lock --check` 에서 실패한다. 사유는 docs/guides/dependencies.md 5절.
#
# docker 와 github-actions 는 lockfile 개념이 없다. FROM digest 와 uses SHA 를 직접 갱신하므로
# 그 거부 사유가 적용되지 않는다 — 오히려 갱신 담당이 없으면 핀이 조용히 낡는다.
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
