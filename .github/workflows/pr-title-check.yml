name: pr-title-check

# PR title을 Conventional Commits 형식으로 강제 — squash merge 시 PR title이 commit message가 되어
# git history·GitHub 자동 release notes(ADR 0030)의 입력. 버전 semver 결정 가독성 + history 일관.
#
# 허용 type: feat fix docs chore refactor perf test build ci style revert
# breaking change: title에 "!" 또는 body에 "BREAKING CHANGE:"

on:
  # main PR 에서만 — develop PR 은 게이트 없이 받는 정책과 정합 (검증은 develop->main PR 단일 게이트).
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            PR title subject는 소문자로 시작해야 함.
            예: `feat: add ...` / `fix: handle ...`
