name: pr-title-check

# PR title 형식과 AI 메타데이터 부재를 강제한다.
# develop PR 은 squash 라 PR title 이 그대로 commit message 가 되고, main PR 은 자동 release notes 의 입력이 된다.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pr title + metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            PR title subject는 소문자로 시작해야 함.
            예: `feat: add ...` / `fix: handle ...`

      # title·body 를 env 로 받는다 — run 안에 직접 보간하면 script injection 이 된다.
      - name: No AI metadata
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -iqE 'co-authored-by:.*(claude|anthropic)|generated with .*claude|claude code'; then
            echo "::error::PR title/body 에 AI 메타데이터가 있다 — 제거 후 다시 저장한다."
            exit 1
          fi
