name: pr-title-check


on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pr title + metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            PR title subject는 소문자로 시작해야 함.
            예: `feat: add ...` / `fix: handle ...`

      - name: No attribution metadata
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          metadata_pattern='^[[:space:]]*(co-authored-by:|generated[ -](with|by):?|assisted([ -]by:|[[:space:]]+by)|[^[:space:]]+[ -]generated([^[:alnum:]_]|$))'
          if grep -iqE "$metadata_pattern" <<< "$TITLE
          $BODY"; then
            echo "::error::PR title/body 에 작성 주체 메타데이터가 있다 — 제거 후 다시 저장한다."
            exit 1
          fi
