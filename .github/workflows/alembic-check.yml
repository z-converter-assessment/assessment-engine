name: alembic-check

# ORM 모델 변경 + 마이그레이션 누락 자동 검출.
# 운영 정책 단일 진실: CLAUDE.md #C4 + docs/operations/alembic.md.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/assessment_engine/db/models/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - '.github/workflows/alembic-check.yml'
  # PR 검증 후 merge 시점 안전망 — admin override·force-push 보호.
  push:
    branches: [main, develop]
    paths:
      - 'src/assessment_engine/db/models/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - '.github/workflows/alembic-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: assessment_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: assessment_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # `uv sync --frozen` — uv.lock 의존성 트리 그대로 install. lockfile/pyproject drift 시 fail
      # → CI에서 lockfile 신선도까지 보장. `--extra dev`로 pytest·ruff·testcontainers 포함.
      - name: Install project
        run: uv sync --frozen --extra dev

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (ORM vs migrations drift)
        run: uv run alembic check
