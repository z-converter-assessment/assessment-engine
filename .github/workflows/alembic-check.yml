name: alembic-check

# ORM 모델 변경 + 마이그레이션 누락 자동 검출.
# 운영 정책 단일 진실: CLAUDE.md #C4 + docs/operations/alembic.md.

on:
  # main PR 에서만 — ORM-migration drift 는 develop->main PR 단일 게이트에서 차단. paths 조건 없이 항상
  # 발화(required status check 가 paths skip 으로 N/A 되어 머지 block 되는 함정 회피). alembic check(~10s) 경량.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # ADR 0024: pgvector extension 의무 — timescaledb-ha 변형 (TimescaleDB + pgvector + postgis all-in-one).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: assessment_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      ALEMBIC_CONFIG: src/assessment_engine/_alembic.ini
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: assessment_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # `uv sync --frozen` — uv.lock 의존성 트리 그대로 install. lockfile/pyproject drift 시 fail
      # → CI에서 lockfile 신선도까지 보장. `--group dev`로 pytest·ruff·testcontainers 포함.
      - name: Install project
        run: uv sync --frozen --group dev

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (ORM vs migrations drift)
        run: uv run alembic check
