name: alembic-check

# ORM 모델을 고치고 마이그레이션을 안 만든 경우를 검출한다. 절차는 docs/guides/migrate.md.

on:
  # paths 조건 없이 항상 발화 — required status check 가 paths skip 으로 N/A 되어 머지가 막히는 함정 회피.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # 운영과 같은 이미지 — TimescaleDB·pgvector·postgis 를 한 이미지에 담은 변형이다.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: assessment_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      ALEMBIC_CONFIG: src/assessment_engine/_alembic.ini
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: assessment_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project
        run: uv sync --frozen --group dev

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (ORM vs migrations drift)
        run: uv run alembic check
