name: alembic-check

# ORM 모델 변경 + 마이그레이션 누락 자동 검출.
# 운영 정책 단일 진실: CLAUDE.md #C4 + docs/operations/alembic.md.

on:
  # paths 조건 제거 — main/develop PR 시 항상 발화. branch protection 의 required status check
  # 등록 시 paths skip 되어 check 자체 N/A 되어 머지 block 되는 함정 회피 (특히 main PR 강화).
  # alembic check (~10s) 부담 미약. CI 실패·이메일 폭탄 회피 우선.
  #
  # push 트리거 제거 — drift는 PR gate(develop·main)에서 차단. merge 후 재실행은 중복.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # ADR 0024: pgvector extension 의무 — timescaledb-ha 변형 (TimescaleDB + pgvector + postgis all-in-one).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: assessment_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: assessment_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # `uv sync --frozen` — uv.lock 의존성 트리 그대로 install. lockfile/pyproject drift 시 fail
      # → CI에서 lockfile 신선도까지 보장. `--group dev`로 pytest·ruff·testcontainers 포함.
      - name: Install project
        run: uv sync --frozen --group dev

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (ORM vs migrations drift)
        run: uv run alembic check
