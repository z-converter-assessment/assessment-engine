name: codeql

# Static Application Security Testing (SAST) — GitHub CodeQL.
# 본 repo 코드 자체의 SQL injection·secret leak·XSS·hardcoded credentials 등 패턴 정적 분석.
# 의존성 CVE 는 별도 — GitHub Dependabot alerts 로 수신 (CI gate 아님, docs/development/dependencies.md).
#
# 결과는 Security 탭의 "Code scanning alerts"에 보고됨.

on:
  # SAST 는 main PR 에서만 — develop->main PR 단일 게이트에서 코드 자체 검사. 주기 cron 없음.
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # Security 탭 alert 작성
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: python
          # default queries + security-extended로 보안 query 풀 set 확장.
          queries: security-extended

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:python"
