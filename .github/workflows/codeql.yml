name: codeql

# 본 repo 코드의 취약 패턴 정적 분석. 결과는 Security 탭 alert 이며 required status check 가 아니다.

on:
  # main PR 에서만 — 분석이 무겁고 alert 성격이라 develop 게이트에는 넣지 않는다.
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # Security 탭 alert 작성
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: python
          # 기본 세트로는 놓치는 패턴이 있어 보안 query 를 확장한다.
          queries: security-extended

      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:python"
