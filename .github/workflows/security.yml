name: security

# 의존성 CVE 자동 검사 — 신규 lockfile drift 또는 새 CVE 공개 시 감지.
#
# Trigger:
#   - pyproject.toml / uv.lock 변경된 PR → 변경 직후 검증
#   - 매주 월요일 09:00 UTC (KST 월요일 18:00) cron → 기존 의존성에 새 CVE 공개됐을 때 감지
#
# 본 repo 책임: CI 영역의 의존성 보안. 인프라 측은 image scanning(Trivy 등)으로 보완 가능.

on:
  # paths 조건 제거 — main PR 시 항상 발화. branch protection required status check
  # 등록 시 paths skip → check 자체 N/A → 머지 block 함정 회피.
  # 의존성 CVE는 release gate(main PR) + 정기 cron(main)으로 검증. develop PR/push마다는 과함.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # `--no-install-project` — self(assessment-engine)는 PyPI 미공개라 audit 대상 아님.
      # 의존성만 venv에 install하면 pip-audit이 self editable 이슈 없이 의존성만 검사.
      - name: Install dependencies only (no project)
        run: uv sync --frozen --no-install-project

      # pip-audit를 같은 venv에 install 후 venv 안 의존성 packages만 audit.
      # `--strict` — vulnerability 발견 시 exit 1로 CI fail.
      # `uv run --no-sync` — uv run의 자동 sync 차단. 자동 sync가 self를 .venv에 재install해서
      #   self editable 이슈를 다시 트리거하는 걸 방지 (`--no-install-project` 효과 보존).
      - name: pip-audit
        run: |
          uv pip install pip-audit
          uv run --no-sync pip-audit --strict
