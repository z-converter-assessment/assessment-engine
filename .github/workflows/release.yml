name: release

# 릴리스 = pyproject.toml 의 version 을 올린 커밋이 main 에 들어오는 것. git tag 는 발행 성공 후 본 워크플로가
# 그 값에서 파생 생성한다 — 사람이 붙이지 않으므로 파일과 태그가 어긋날 수 없다.
# 절차·산출물 카탈로그는 docs/guides/release.md.

on:
  push:
    branches:
      - main
  # 이미 릴리스된 버전을 다시 발행할 때 사용한다 (이미지 유실·재서명 등).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 중간 cancel 은 partial release 를 남긴다.
  cancel-in-progress: false

jobs:
  resolve-version:
    name: resolve version + decide release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      # fetch-depth: 0 — 기존 태그 목록을 봐야 중복 릴리스를 판정할 수 있다.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # prerelease 는 미지원 — 도입 시 규약 통일을 별도 ADR 로 결정한다.
      # 태그가 이미 있으면 버전을 안 올린 일반 머지이므로 릴리스하지 않는다. dispatch 는 재발행이라 그대로 진행한다.
      - name: Resolve version and decide
        id: v
        run: |
          VERSION="$(uv version --short)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not stable semver (expected X.Y.Z; prerelease unsupported)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION already released — skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release-image:
    name: build + GHCR push (multi-arch + cosign + SBOM)
    needs: resolve-version
    if: needs.resolve-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/assessment-engine
    permissions:
      contents: write   # 릴리스 태그 push
      id-token: write   # Sigstore/cosign keyless signing (OIDC token)
      packages: write   # GHCR push (Docker image upload)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # runner 가 amd64 라 arm64 는 QEMU emulation 으로 빌드한다.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 트리거가 branch push 라 ref 에 태그가 없다 — value 로 확정 버전을 넘겨 alias 를 파생시킨다.
      # labels 출력은 쓰지 않는다. 저장소 메타데이터로 정적 라벨까지 만들어 Dockerfile LABEL 을 덮는다.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.resolve-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.resolve-version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build + push (linux/amd64,arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 빌드 시점에만 아는 값. 이미지 정체(title·description·licenses·vendor·source)는 Dockerfile LABEL 이 선언한다.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true   # BuildKit 자동 SBOM (SPDX 형식) — image attestation 으로 첨부

      # keyless — OIDC 로 서명해 개인키를 관리하지 않는다. 검증 명령은 docs/guides/release.md.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # tag 는 옮겨갈 수 있으므로 immutable digest 에 서명한다. 태그마다 호출하면 같은 digest 에
          # 서명 번들만 중복 적재된다 — alias 개수와 무관하게 1 회다.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # 이미지 발행과 서명이 끝난 뒤에 태그를 남긴다 — 앞 단계가 실패하면 태그가 없어 그대로 재시도할 수 있다.
      - name: Tag released commit
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::tag v$VERSION already exists — skipping"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
