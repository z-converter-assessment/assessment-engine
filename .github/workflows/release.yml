name: release

# semver tag(v*) push 시 두 산출물 동시 생성:
#   (1) wheel + sdist + SHA256SUMS + SBOM + Sigstore signature + docker-compose.yml + .env.example → GitHub Release
#   (2) Docker image (linux/amd64, linux/arm64) → GHCR push + cosign sign + SBOM (ADR 0017)
# 외부 인프라는 wheel (systemd·venv) 또는 image (docker·k8s) 어느 채널이든 자유 선택. compose+.env.example 첨부는
# 릴리즈 다운로드만으로 퀵스타트 가능케 함 (ADR 0033) — `ENGINE_IMAGE=ghcr.io/<org>/assessment-engine:v<X>
# docker compose up -d --no-build` 로 (2)의 GHCR 이미지 pull (소스 clone 불요).
#
# 발사 trigger: develop->main PR 머지 후 운영자가 main 에 직접 push 하는 semver tag(v*) (ADR 0030).
# 버전은 repo 에 없고 tag 가 단일 진실 — hatch-vcs 가 빌드 시 tag 에서 derive (bump 커밋 없음).
# tag 는 운영자 로컬 자격증명으로 push 되므로 본 워크플로 정상 발사
# (이전 release-please bot 의 GITHUB_TOKEN tag push 는 다른 워크플로 트리거 안 돼 App token 우회 필요했음 — 제거됨).
# workflow_dispatch 는 tag 누락·재발행 대비 수동 백업.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (예: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write   # GitHub Release 생성·artifact upload 필요
  id-token: write   # Sigstore keyless signing (OIDC token) — wheel + image 양쪽 사용
  packages: write   # GHCR push (Docker image upload)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # release는 cancel 안 함 — 중간 cancel 시 partial release 위험.
  cancel-in-progress: false

jobs:
  # ─── (1) wheel + sdist → GitHub Release ───────────────────────────────────
  release-wheel:
    name: build + GitHub Release (wheel/sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — hatch-vcs 가 tag 에서 버전 derive 하려면 full history + tags 필요 (ADR 0030).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # wheel + sdist 둘 다 생성. 버전은 위 checkout 의 git tag 에서 hatch-vcs 가 derive (ADR 0030).
      - name: uv build
        run: uv build

      # `--`로 glob 종료 — dash로 시작하는 우발적 파일명이 sha256sum option으로 해석되지 않게 (shellcheck SC2035).
      - name: sha256 checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS

      # SBOM (Software Bill of Materials) — CycloneDX 표준. 의존성 트리 명세 첨부.
      # 외부 인프라가 release artifact의 의존성·CVE 추적 가능 (산업 표준 ADR 0012 강화).
      - name: Generate SBOM
        run: |
          # venv 비의존 — CI runner 에 .venv 가 없어도 동작 (이전 `uv pip install` 은 venv 요구로 실패).
          # uv export 로 uv.lock 의 runtime deps 추출 후 uvx 로 cyclonedx 실행 (ephemeral tool env).
          uv export --frozen --no-dev --format requirements-txt > dist/_sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements dist/_sbom-requirements.txt --output-file dist/sbom.cdx.json
          rm -f dist/_sbom-requirements.txt

      # Sigstore keyless signing — wheel·sdist에 cryptographic signature (`.sigstore` 파일).
      # OIDC 기반 keyless (private key 관리 0). 외부 인프라가 `cosign verify-blob`으로 무결성 검증 가능.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz

      # GitHub Release 자동 생성 + 첨부. release body는 git tag annotation 그대로 가져옴.
      # 인프라 측이 release page 또는 API로 wheel·sha256·sbom·signature 다운로드.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/*.sigstore.json
            docker-compose.yml
            .env.example
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─── (2) Docker image → GHCR (multi-arch) ─────────────────────────────────
  release-image:
    name: build + GHCR push (multi-arch + cosign + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # buildx + QEMU — linux/amd64 + linux/arm64 cross-build. GitHub Actions runner 가 amd64 라 arm64 는 QEMU emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # GHCR 인증 — GITHUB_TOKEN 자동 (permissions.packages: write 의존).
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tag policy: v0.1.0 → :0.1.0 + :0.1 + :0 + :latest (stable tags 만 latest).
      # docker/metadata-action 이 git tag 에서 semver 파싱 후 매핑.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/assessment-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Multi-arch build + push. cache-from/to gha 로 layer cache (반복 빌드 시간 절감).
      - name: Build + push (linux/amd64,arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker 빌드 컨텍스트엔 .git 미포함 — hatch-vcs 가 tag 를 못 보므로 tag 버전을 주입 (ADR 0030).
          # steps.meta.outputs.version = git tag 의 semver (예: 0.1.0). Dockerfile 이 SETUPTOOLS_SCM_PRETEND_VERSION 로 사용.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true   # BuildKit 자동 SBOM (SPDX 형식) — image attestation 으로 첨부

      # Cosign keyless image signing — wheel 의 sigstore signing 과 동일 OIDC keychain.
      # 운영자가 `cosign verify ghcr.io/.../assessment-engine:v0.1.0 \
      #   --certificate-identity-regexp=... --certificate-oidc-issuer=...` 로 무결성·발행자 검증.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # tag 들 각각에 대해 digest 기반 서명 (mutable tag 가 아닌 immutable digest 서명).
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
