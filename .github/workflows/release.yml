name: release

# semver tag(v*) push 시 두 산출물 동시 생성:
#   (1) wheel + sdist + SHA256SUMS + SBOM + Sigstore signature → GitHub Release
#   (2) Docker image (linux/amd64, linux/arm64) → GHCR push + cosign sign + SBOM (ADR 0017)
# 외부 인프라는 wheel (systemd·venv) 또는 image (docker·k8s) 어느 채널이든 자유 선택.
#
# 수동 발사 — release-please bot의 GITHUB_TOKEN tag push가 다른 워크플로 트리거 안 함
# (GitHub 보안 정책)이라 본 옵션으로 수동 trigger. 영구 해결은 release-please 측에 PAT 또는
# GitHub App 사용.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (예: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write   # GitHub Release 생성·artifact upload 필요
  id-token: write   # Sigstore keyless signing (OIDC token) — wheel + image 양쪽 사용
  packages: write   # GHCR push (Docker image upload)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # release는 cancel 안 함 — 중간 cancel 시 partial release 위험.
  cancel-in-progress: false

jobs:
  # ─── (1) wheel + sdist → GitHub Release ───────────────────────────────────
  release-wheel:
    name: build + GitHub Release (wheel/sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # wheel + sdist 둘 다 생성. sdist는 source 재현 가능성 보존용 (PEP 517).
      - name: uv build
        run: uv build

      # `--`로 glob 종료 — dash로 시작하는 우발적 파일명이 sha256sum option으로 해석되지 않게 (shellcheck SC2035).
      - name: sha256 checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS

      # SBOM (Software Bill of Materials) — CycloneDX 표준. 의존성 트리 명세 첨부.
      # 외부 인프라가 release artifact의 의존성·CVE 추적 가능 (산업 표준 ADR 0012 강화).
      - name: Generate SBOM
        run: |
          uv pip install cyclonedx-bom
          uv run cyclonedx-py environment --output-file dist/sbom.cdx.json

      # Sigstore keyless signing — wheel·sdist에 cryptographic signature (`.sigstore` 파일).
      # OIDC 기반 keyless (private key 관리 0). 외부 인프라가 `cosign verify-blob`으로 무결성 검증 가능.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz

      # GitHub Release 자동 생성 + 첨부. release body는 git tag annotation 그대로 가져옴.
      # 인프라 측이 release page 또는 API로 wheel·sha256·sbom·signature 다운로드.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/*.sigstore
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─── (2) Docker image → GHCR (multi-arch) ─────────────────────────────────
  release-image:
    name: build + GHCR push (multi-arch + cosign + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # buildx + QEMU — linux/amd64 + linux/arm64 cross-build. GitHub Actions runner 가 amd64 라 arm64 는 QEMU emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 인증 — GITHUB_TOKEN 자동 (permissions.packages: write 의존).
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tag policy: v0.1.0 → :0.1.0 + :0.1 + :0 + :latest (stable tags 만 latest).
      # docker/metadata-action 이 git tag 에서 semver 파싱 후 매핑.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/assessment-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Multi-arch build + push. cache-from/to gha 로 layer cache (반복 빌드 시간 절감).
      - name: Build + push (linux/amd64,arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true   # BuildKit 자동 SBOM (SPDX 형식) — image attestation 으로 첨부

      # Cosign keyless image signing — wheel 의 sigstore signing 과 동일 OIDC keychain.
      # 운영자가 `cosign verify ghcr.io/.../assessment-engine:v0.1.0 \
      #   --certificate-identity-regexp=... --certificate-oidc-issuer=...` 로 무결성·발행자 검증.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # tag 들 각각에 대해 digest 기반 서명 (mutable tag 가 아닌 immutable digest 서명).
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
