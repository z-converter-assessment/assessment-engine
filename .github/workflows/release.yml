name: release

# semver tag(v*) push 시 두 산출물 동시 생성:
#   (1) wheel + sdist + SHA256SUMS + SBOM + Sigstore signature + docker-compose.yml(prod-safe base) + env.example → GitHub Release
#   (2) Docker image (linux/amd64, linux/arm64) → GHCR push + cosign sign + SBOM (ADR 0017)
# 외부 인프라는 wheel (systemd·venv) 또는 image (docker·k8s) 어느 채널이든 자유 선택. 첨부 docker-compose.yml 은
# prod-safe base(build 키 없음, ADR 0035) — 릴리즈 다운로드만으로 빌드 없이 pull-and-run. base 의 __ENGINE_VERSION__
# 은 본 워크플로가 단일 진실 버전으로 치환해 GHCR 정확 버전을 핀. infra 는 받은 base 에 PGDATA_HOST·MQ_DATA_HOST·
# OLLAMA_* 주입 후 `docker compose up -d` (GHCR public — 토큰 없이 pull, ADR 0035 3절 정정).
#
# 발사 trigger: develop->main PR 머지 후 운영자가 main 에 직접 push 하는 semver tag(v*) (ADR 0030).
# 버전은 repo 에 없고 tag 가 단일 진실 — hatch-vcs 가 빌드 시 tag 에서 derive (bump 커밋 없음).
# tag 는 운영자 로컬 자격증명으로 push 되므로 본 워크플로 정상 발사
# (GITHUB_TOKEN 으로 push 한 tag 는 다른 워크플로를 트리거하지 않으므로 운영자 직접 push 가 필수).
# workflow_dispatch 는 tag 누락·재발행 대비 수동 백업.
#
# 버전 derive 단일 진실 (ADR 0030 정정 2026-06-08):
#   resolve-version job 이 hatch-vcs(PEP 440) 실측값을 1회 산출 -> job output `version`. 두 release job 이
#   그 output 을 받아쓴다 (compose 핀·이미지 build-arg). 정규화 규칙이 hatch-vcs 하나로 수렴 (single-source, C).
#   resolve-version 에서 stable semver `vX.Y.Z` 형식 가드 (prerelease 미지원, A). 두 release job 은 각자 산출물
#   (wheel 파일명·이미지 태그)이 단일 진실과 동일한지 assert (등가성 검증, B). 셋 중 하나라도 어긋나면 release fail.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (예: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write   # GitHub Release 생성·artifact upload 필요
  id-token: write   # Sigstore keyless signing (OIDC token) — wheel + image 양쪽 사용
  packages: write   # GHCR push (Docker image upload)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # release는 cancel 안 함 — 중간 cancel 시 partial release 위험.
  cancel-in-progress: false

jobs:
  # ─── (0) 버전 derive 단일 진실 (single-source + 형식 가드) ──────────────────
  # hatch-vcs(PEP 440) 실측값을 1회 산출해 두 release job 에 fan-out (ADR 0030 정정, C).
  # tag derive 가 wheel·이미지·compose 4경로로 분산돼 정규화 규칙이 갈리던 구조를 본 job 단일 소스로 수렴.
  resolve-version:
    name: resolve + validate version (single source)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # dispatch 도 해당 tag 커밋을 체크아웃 — hatch-vcs 가 정확 버전을 derive 하도록 ref 보정.
      # fetch-depth: 0 — hatch-vcs 가 tag 에서 버전 derive 하려면 full history + tags 필요.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      # A. stable semver 형식 가드 — prerelease/비정규 태그 거부 (ADR 0030 정정: prerelease 미지원).
      # 정규화 규칙 차이(PEP 440 vs SemVer)의 발현 원천 제거. prerelease 도입 시 규약 통일 별도 ADR 의무.
      - name: Validate tag is stable semver
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RAW' is not stable semver (expected vX.Y.Z; prerelease unsupported — ADR 0030 정정)"
            exit 1
          fi

      # C. hatch-vcs 실측 PEP 440 버전을 단일 진실로 산출. uvx --with hatch-vcs 로 ephemeral env 에 plugin 포함.
      # tag 정확 커밋이 아니면 dev 버전(X.Y.Z.devN+g<sha>) 이 나오므로 ${RAW#v} 와 대조해 stable 산출을 강제.
      - name: Resolve version (hatch-vcs single source)
        id: v
        run: |
          VERSION="$(uvx --with hatch-vcs hatch version)"
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$VERSION" != "${RAW#v}" ]]; then
            echo "::error::hatch-vcs version '$VERSION' != tag '${RAW#v}' (checkout not on tag commit?)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─── (1) wheel + sdist → GitHub Release ───────────────────────────────────
  release-wheel:
    name: build + GitHub Release (wheel/sdist)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # dispatch ref 보정 + fetch-depth: 0 — hatch-vcs 가 동일 .git 에서 단일 진실과 같은 버전을 build.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # wheel + sdist 둘 다 생성. 버전은 위 checkout 의 git tag 에서 hatch-vcs 가 derive (ADR 0030).
      - name: uv build
        run: uv build

      # B. 등가성 검증 — uv build 가 낸 wheel 파일명 버전이 단일 진실(resolve-version)과 같은지 assert.
      # 어긋나면 wheel job 의 .git derive 와 resolve job 산출이 갈렸다는 뜻 -> release fail (partial 발행 방지).
      - name: Verify wheel version matches single source
        run: |
          EXPECTED="${{ needs.resolve-version.outputs.version }}"
          WHEEL="$(ls dist/assessment_engine-*.whl)"
          ACTUAL="$(basename "$WHEEL" | sed -E 's/^assessment_engine-([^-]+)-.*/\1/')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::wheel version '$ACTUAL' != single source '$EXPECTED'"
            exit 1
          fi

      # prod-safe base compose + env 카탈로그를 dist 로 staging 후 이미지 핀 치환 (ADR 0035).
      # base docker-compose.yml 의 __ENGINE_VERSION__ placeholder 를 단일 진실 버전으로 치환 -> 첨부본은 GHCR 정확 버전 핀.
      # 버전은 resolve-version job output (이전 ${ref_name#v} strip 경로 폐기 — ADR 0030 정정 C).
      # (소스 repo 본문은 placeholder 유지 — dev 는 override.yml 로컬 빌드라 무관.)
      - name: Stage compose + env assets
        run: |
          cp docker-compose.yml dist/docker-compose.yml
          cp env.example dist/env.example
          sed -i "s/__ENGINE_VERSION__/${{ needs.resolve-version.outputs.version }}/g" dist/docker-compose.yml

      # `--`로 glob 종료 — dash로 시작하는 우발적 파일명이 sha256sum option으로 해석되지 않게 (shellcheck SC2035).
      # compose·env 도 무결성 검증 대상 포함 (ADR 0035 — 외부 인프라가 받은 compose 도 sha256 -c 검증).
      - name: sha256 checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz docker-compose.yml env.example > SHA256SUMS

      # SBOM (Software Bill of Materials) — CycloneDX 표준. 의존성 트리 명세 첨부.
      # 외부 인프라가 release artifact의 의존성·CVE 추적 가능 (산업 표준 ADR 0012 강화).
      - name: Generate SBOM
        run: |
          # venv 비의존 — CI runner 에 .venv 가 없어도 동작 (이전 `uv pip install` 은 venv 요구로 실패).
          # uv export 로 uv.lock 의 runtime deps 추출 후 uvx 로 cyclonedx 실행 (ephemeral tool env).
          uv export --frozen --no-dev --format requirements-txt > dist/_sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements dist/_sbom-requirements.txt --output-file dist/sbom.cdx.json
          rm -f dist/_sbom-requirements.txt

      # Sigstore keyless signing — wheel·sdist에 cryptographic signature (`.sigstore` 파일).
      # OIDC 기반 keyless (private key 관리 0). 외부 인프라가 `cosign verify-blob`으로 무결성 검증 가능.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz

      # GitHub Release 자동 생성 + 첨부. release body는 git tag annotation 그대로 가져옴.
      # 인프라 측이 release page 또는 API로 wheel·sha256·sbom·signature 다운로드.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/*.sigstore.json
            dist/docker-compose.yml
            dist/env.example
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─── (2) Docker image → GHCR (multi-arch) ─────────────────────────────────
  release-image:
    name: build + GHCR push (multi-arch + cosign + SBOM)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # dispatch ref 보정 — Dockerfile 빌드 소스를 해당 tag 커밋으로 고정.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # buildx + QEMU — linux/amd64 + linux/arm64 cross-build. GitHub Actions runner 가 amd64 라 arm64 는 QEMU emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # GHCR 인증 — GITHUB_TOKEN 자동 (permissions.packages: write 의존).
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tag policy: v0.1.0 → :0.1.0 + :0.1 + :0 + :latest (stable tags 만 latest).
      # docker/metadata-action 이 git tag 에서 semver 파싱 후 :X.Y / :X / latest alias 매핑 (alias 매핑 전용).
      # 정확 버전(:X.Y.Z)·build-arg 는 metadata-action 독립 파싱이 아니라 resolve-version 단일 진실을 쓴다 (ADR 0030 정정 C).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/assessment-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # B. 등가성 검증 — metadata-action(SemVer) 이 파싱한 {{version}} 이 단일 진실(hatch-vcs PEP 440)과 같은지 assert.
      # stable-only(A) 라 항상 동일해야 함 — 어긋나면 정규화 규칙 drift 또는 dispatch ref 비-tag (meta.version 빈값) -> release fail.
      - name: Verify image tag version matches single source
        run: |
          EXPECTED="${{ needs.resolve-version.outputs.version }}"
          ACTUAL="${{ steps.meta.outputs.version }}"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::image meta version '$ACTUAL' != single source '$EXPECTED'"
            exit 1
          fi

      # Multi-arch build + push. cache-from/to gha 로 layer cache (반복 빌드 시간 절감).
      - name: Build + push (linux/amd64,arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker 빌드 컨텍스트엔 .git 미포함 — hatch-vcs 가 tag 를 못 보므로 버전을 주입 (ADR 0030).
          # 버전 = resolve-version 단일 진실 (metadata-action 독립 파싱이 아님 — ADR 0030 정정 C).
          # Dockerfile 이 APP_VERSION 을 SETUPTOOLS_SCM_PRETEND_VERSION 로 hatch-vcs 에 주입.
          build-args: |
            APP_VERSION=${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true   # BuildKit 자동 SBOM (SPDX 형식) — image attestation 으로 첨부

      # Cosign keyless image signing — wheel 의 sigstore signing 과 동일 OIDC keychain.
      # 운영자가 `cosign verify ghcr.io/.../assessment-engine:v0.1.0 \
      #   --certificate-identity-regexp=... --certificate-oidc-issuer=...` 로 무결성·발행자 검증.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # tag 들 각각에 대해 digest 기반 서명 (mutable tag 가 아닌 immutable digest 서명).
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

  # ─── (3) pgAdmin image (servers.json 내장) → GHCR ─────────────────────────
  # dpage/pgadmin4 + servers.json COPY 경량 wrapper. base docker-compose.yml 이 본 이미지를 버전 핀 pull
  # (servers.json 내장 -> bind mount·release asset 0, A0 정합). engine 과 달리 외부 이미지 wrapper 라 cosign/SBOM 생략.
  release-pgadmin-image:
    name: build + GHCR push (pgadmin, servers.json 내장)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/assessment-pgadmin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify image tag version matches single source
        run: |
          EXPECTED="${{ needs.resolve-version.outputs.version }}"
          ACTUAL="${{ steps.meta.outputs.version }}"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::pgadmin image meta version '$ACTUAL' != single source '$EXPECTED'"
            exit 1
          fi

      - name: Build + push (linux/amd64,arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/pgadmin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
