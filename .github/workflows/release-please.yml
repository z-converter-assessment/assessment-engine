name: release-please

# Conventional commits 기반 자동 release 관리 (ADR 0013).
#
# 흐름:
#   1. main에 commit push (PR merge 결과)
#   2. 본 workflow 발사 — commit message 분석
#   3. feat/fix/BREAKING CHANGE 감지 시 "Release PR" 자동 생성 (pyproject.toml version bump + CHANGELOG.md 갱신)
#   4. 사용자가 Release PR 검토·merge
#   5. merge 시점에 본 workflow가 tag(v*) 자동 생성·push
#   6. tag push → release.yml 발사 → wheel + sdist + SHA256SUMS GitHub Release 자동 첨부
#
# Release PR이 머지될 때까지 다음 main commit은 같은 Release PR에 누적. 빈 release 안 만듦.

on:
  push:
    branches: [main]

permissions:
  contents: write        # tag 생성·push + commit (CHANGELOG·version bump)
  pull-requests: write   # Release PR 생성·갱신

# release-please는 cancel 안 함 — Release PR 생성 중 cancel 시 partial PR 위험.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: prepare release PR or publish tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub App token 생성 — default GITHUB_TOKEN으로 release-please bot이 tag·commit push
      # 시 다른 워크플로(release.yml)가 trigger 발사 안 함 (GitHub 보안 정책). App token으로
      # push하면 본 제한 우회되어 release.yml의 push tag trigger 정상 발사.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
