name: notify-infra-deploy

on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: strip v prefix from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: dispatch to assessment-infra
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: z-converter-assessment/assessment-infra
          event-type: engine-release
          client-payload: '{"engine_version": "${{ steps.version.outputs.value }}"}'