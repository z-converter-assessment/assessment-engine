name: deploy

# 엔진 rollout — 내부망/OpenStack VM 에 self-hosted runner 로 배포 (ADR 0048).
#
# 매체: docker compose (prod = base + secrets overlay). 배포 대상 = 서명·attestation 된 GHCR 엔진 이미지
#   (release.yml 산출). 본 워크플로는 그 이미지를 대상 VM 에 rollout 한다:
#     cosign verify -> compose pull -> migration(init-container) + up -> health gate -> 실패 시 rollback.
#
# 채널: runs-on self-hosted (대상 VM). VM 은 outbound HTTPS 로 GitHub 폴링만 — inbound·SSH 불요.
#   compose 는 VM 로컬 실행이라 배포 명령이 localhost 작업.
#
# 트리거: workflow_dispatch(version 수동 입력) + `production` Environment protection(운영자 승인 1회).
#   release.yml 성공 후 자동 배포 안 함 — prod 단일 VM 비가역 작업 앞 사람 게이트 (ADR 0048).
#
# 상태·rollback: 배포 대상 디렉토리(DEPLOY_DIR, bootstrap.sh 로 사전 구성)의 `.env` 의 ENGINE_IMAGE 핀이
#   현재 버전. 교체 전 현재 핀을 `.last-good` 으로 capture -> health 실패 시 그 이미지로 되돌린다
#   (capture-before-swap). job 상태는 VM 로컬 파일이라 별도 저장소 불요.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 release 버전 (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read    # checkout (compose 파일 확보)
  packages: read    # GHCR pull (public 이면 불요, private 대비)
  # cosign verify 는 공개 Rekor/Fulcio 조회라 id-token 불요 (서명이 아닌 검증).

concurrency:
  # 같은 VM 에 동시 배포 금지 — rollout 중첩 시 .env/.last-good race.
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollout:
    name: rollout to production VM
    runs-on: [self-hosted, assessment-prod]
    environment: production   # 승인 게이트 — reviewer 승인 후 job 실행 (repo Environments protection rule)
    timeout-minutes: 20
    env:
      # 배포 대상 디렉토리 — bootstrap.sh 가 .env·secrets/·볼륨을 배치한 곳. repo var 로 override 가능.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/assessment-engine' }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/assessment-engine
    steps:
      # 입력 버전 형식 가드 + image 태그 산출 (release.yml 과 동일 stable semver 규약, v 제거).
      - name: Validate version and resolve image
        id: v
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$RAW' is not stable semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "image=${IMAGE_REPO}:${RAW#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"

      # 배포 버전 tag 커밋의 compose 파일을 확보 — 이미지와 compose 토폴로지 버전 일치 보장.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # 공급망 게이트 — 이미지가 이 repo 의 release.yml(GitHub OIDC)에서 서명됐는지 검증. 미통과 시 배포 중단.
      - name: Verify image signature (cosign)
        run: |
          cosign verify "${{ steps.v.outputs.image }}" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" > /dev/null
          echo "signature OK: ${{ steps.v.outputs.image }}"

      # compose 파일을 배포 디렉토리로 동기화 (.env·secrets/ 는 건드리지 않음 — 호스트 config·secret 보존).
      - name: Sync compose files to deploy dir
        run: |
          test -f "${DEPLOY_DIR}/.env" || { echo "::error::${DEPLOY_DIR}/.env 없음 — bootstrap.sh 미실행"; exit 1; }
          cp docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"
          cp docker-compose.secrets.yml "${DEPLOY_DIR}/docker-compose.secrets.yml"

      # capture-before-swap — 현재 .env 의 ENGINE_IMAGE(=현재 실행 중, 직전 정상)를 .last-good 으로 보존 후 새 버전 핀.
      - name: Pin new image (capture previous)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          CURRENT="$(grep -E '^ENGINE_IMAGE=' .env | tail -1 | cut -d= -f2-)"
          if [[ -n "$CURRENT" ]]; then
            printf '%s' "$CURRENT" > .last-good
            echo "previous(last-good): $CURRENT"
          else
            echo "::notice::ENGINE_IMAGE 미핀(최초 배포) — rollback 불가"
          fi
          # ENGINE_IMAGE 라인 교체(있으면) 또는 추가(없으면).
          if grep -qE '^ENGINE_IMAGE=' .env; then
            sed -i "s#^ENGINE_IMAGE=.*#ENGINE_IMAGE=${{ steps.v.outputs.image }}#" .env
          else
            printf '\nENGINE_IMAGE=%s\n' "${{ steps.v.outputs.image }}" >> .env
          fi

      # pull + up. base compose 의 migrate init-container 가 web/consumer 기동 전 alembic upgrade head 실행
      # (depends_on: service_completed_successfully) — migration 이 rollout 에 선행함이 compose 로 보장.
      - name: Pull and up
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d

      # health gate — web /health 200 확인(재시도). migrate/컨테이너 기동까지 대기.
      - name: Health gate
        id: health
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          PORT="$(grep -E '^WEB_PORT=' .env | tail -1 | cut -d= -f2-)"; PORT="${PORT:-8000}"
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1; then
              echo "health OK (attempt $i)"; exit 0
            fi
            sleep 5
          done
          echo "::error::health check 실패 — /health 미응답"
          exit 1

      # rollback — health 실패 시 .last-good 이미지로 되돌려 재기동. .last-good 없으면(최초 배포) 복구 불가.
      - name: Rollback on failure
        if: failure() && steps.health.conclusion == 'failure'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [[ ! -s .last-good ]]; then
            echo "::error::.last-good 없음 — 자동 rollback 불가. 수동 조치 필요"; exit 1
          fi
          LAST="$(cat .last-good)"
          echo "::warning::rollback -> ${LAST}"
          sed -i "s#^ENGINE_IMAGE=.*#ENGINE_IMAGE=${LAST}#" .env
          docker compose up -d
          PORT="$(grep -E '^WEB_PORT=' .env | tail -1 | cut -d= -f2-)"; PORT="${PORT:-8000}"
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1 && { echo "rollback health OK"; exit 0; }
            sleep 5
          done
          echo "::error::rollback 후에도 health 실패 — 수동 조치 필요"; exit 1

      # 성공 시 옛 이미지 정리 (디스크 누수 방지). 실패해도 배포 자체엔 영향 없음.
      - name: Prune old images
        if: success()
        run: docker image prune -f
