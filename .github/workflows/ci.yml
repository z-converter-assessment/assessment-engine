name: ci

# 코드 품질 게이트. 배포(rollout)는 VM 에서 deploy.sh 가 담당한다.
#
#   lint ──┬─> test-unit ─> test-integration
#          ├─> typecheck
#          └─> build
#
# base 별 발화 범위는 job 의 if 조건이 정한다. 게이트 배치 근거는 docs/guides/pre-pr-checklist.md 0절.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      - name: lockfile drift
        run: uv lock --check

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test-unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # property 테스트 생성 횟수는 base 브랜치로 가른다 — main 승격은 선언값 전량, develop 통합은 1/10.
      - name: pytest unit
        env:
          HYPOTHESIS_SCALE: ${{ github.base_ref == 'main' && '1' || '0.1' }}
        run: uv run pytest tests/unit/ -q

  typecheck:
    name: frontend typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # ubuntu-latest 는 node·corepack 내장 — setup-node 불요. pnpm 버전은 package.json packageManager 핀.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend deps (frozen)
        run: pnpm install --frozen-lockfile

      # 생성 TS 타입이 최신 OpenAPI(ViewModel)와 일치하는지 — 엔드포인트 변경 후 codegen 미실행(drift) 차단.
      - name: codegen drift check
        run: |
          pnpm run codegen
          git diff --exit-code -- src/assessment_engine/web/static/js/generated/api.ts

      # `// @ts-check` 를 단 클라 JS 가 생성 타입 계약을 지키는지 컴파일로 강제한다.
      - name: tsc typecheck
        run: pnpm run typecheck

  build:
    name: wheel build
    runs-on: ubuntu-latest
    needs: [lint]
    # 패키징 검증은 main PR에서만 — release gate. 이미지 빌드+서명+publish 는 release.yml 이 수행.
    if: github.base_ref == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # 정적 자원·migrations 가 패키지에 포함되는지를 머지 전에 잡는다.
      - name: uv build
        run: uv build

      - name: wheel smoke (install + import + 자원 포함)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import assessment_engine.web.main; import assessment_engine.consumer.main; import assessment_engine.worker.main"
          /tmp/wheel-smoke/bin/python -c "from importlib.resources import files; p = files('assessment_engine'); assert (p / 'web' / 'templates' / 'base.html').is_file(); assert (p / 'web' / 'static' / 'js' / 'chart-utils.js').is_file(); assert (p / 'migrations' / 'env.py').is_file(); assert (p / '_alembic.ini').is_file()"

  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: [test-unit]
    # main PR 에서만 — 컨테이너 기동이 필요해 무겁다. develop PR 의 CI 는 단위 테스트까지.
    if: github.base_ref == 'main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # testcontainers 가 TimescaleDB 컨테이너를 띄운다 — runner 의 docker daemon 필요.
      - name: pytest integration
        run: uv run pytest tests/integration/ -q
