name: ci

# 본 repo CI — PR 마다 회귀·정합 자동 차단.
# 책임: 코드 quality 보증(빌드·테스트·lint). CD(엔진 rollout)는 VM 에서 deploy.sh 실행 (ADR 0048).
#
# Job 정합 그래프:
#   lint ──┬─> test-unit ─> test-integration
#          └─> build
#
# PR base·event별 발화 분기 (역할 분리 — 같은 검증 2회 금지):
#   develop PR  : lint + test-unit (integration·build skip — 경량 게이트)
#   develop push: lint + test-unit + test-integration (merge 후 통합 검증 1회 보충)
#   main PR     : 전부 (release gate — full 검증)
#   main push   : ci 미발화 (main PR에서 full 통과 + branch protection이 gate 강제). 릴리즈는 main 에 tag push -> release.yml (ADR 0030)

on:
  pull_request:
    branches: [main, develop]
  # merge 후 develop 통합 검증(test-integration) 보충용 — PR이 경량 게이트라 무거운 검증을 여기서 1회.
  # main push는 ci 미발화: main PR full 검증 완료 + branch protection이 직접 push·red merge를 차단.
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 branch에 새 push 들어오면 옛 run cancel — CI 자원 즉시 절감.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      - name: ruff check
        run: uv run ruff check .

      # Dockerfile lint — dev 한정이지만 best practice 정합. info 수준은 fail 아님.
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test-unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # --cov-report=term — console에 라인별 coverage 표시 (PR review 시 즉시 가시화). 외부 리포터(codecov 등) 미사용이라 artifact 미업로드.
      - name: pytest unit (with coverage)
        run: uv run pytest tests/unit/ -v --cov=assessment_engine --cov-report=term

  build:
    name: wheel build
    runs-on: ubuntu-latest
    needs: [lint]
    # 패키징 검증은 main PR에서만 — release gate. tag push 시 release.yml 이 이미지 빌드+서명+publish 수행.
    if: github.base_ref == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # 패키징 검증 — release-image(Dockerfile)가 내부적으로 install 하는 wheel force-include 정합을 머지 전에 잡는다 (ADR 0048).
      # `uv build`가 sdist + wheel 둘 다 생성. wheel은 hatchling이 pyproject.toml의 packages·force-include 적용.
      - name: uv build
        run: uv build

      # smoke: 빌드된 wheel을 fresh venv에 install + import 검증. 패키징 sanity test.
      # 정적 자원(templates·static)·migrations·alembic.ini 모두 포함됐는지 file existence로 확인.
      - name: wheel smoke (install + import + 자원 포함)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import assessment_engine.web.main; import assessment_engine.consumer.main"
          /tmp/wheel-smoke/bin/python -c "from importlib.resources import files; p = files('assessment_engine'); assert (p / 'web' / 'templates' / 'base.html').is_file(); assert (p / 'web' / 'static' / 'js' / 'chart-utils.js').is_file(); assert (p / 'migrations' / 'env.py').is_file(); assert (p / '_alembic.ini').is_file()"

  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: [test-unit]
    # PR: develop=skip(경량 게이트) / main=run(release gate). push: develop merge 후 통합 검증 1회.
    # wheel build 의존 제거 — integration은 소스로 동작, build와 독립 (develop push에서 build skip돼도 무관).
    if: github.event_name == 'push' || github.base_ref == 'main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # testcontainers가 TimescaleDB 컨테이너 자동 spawn — GHA runner의 docker daemon 사용.
      - name: pytest integration (with coverage)
        run: uv run pytest tests/integration/ -v --cov=assessment_engine --cov-report=term
