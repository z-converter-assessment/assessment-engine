name: ci

# 코드 품질 게이트. 배포(rollout)는 VM 에서 deploy.sh 가 담당한다.
#
#   lint +-> test-unit -> test-integration
#        +-> typecheck
#        +-> build
#
# base 별 발화 범위는 job 의 if 조건이 정한다. 게이트 배치 근거는 docs/guides/pre-pr-checklist.md 0절.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (locked)
        run: uv sync --locked --group dev

      - name: lockfile drift
        run: uv lock --check

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test-unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (locked)
        run: uv sync --locked --group dev

      # hypothesis 반례 DB 보존 — 선언 23,500 examples 를 매번 처음부터 다시 뒤지면 어렵게 찾은 반례가
      # 잡 종료와 함께 사라진다. develop(SCALE=0.1)이 우연히 잡은 반례도 main 승격 실행이 승계한다.
      # key 에 run_id 를 넣어 매 실행 새로 쓰고, restore-keys 로 직전 실행분을 물려받는다.
      - name: Cache hypothesis examples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis/examples
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-

      # property 테스트 생성 횟수는 base 브랜치로 가른다 — main 승격은 선언값 전량, develop 통합은 1/10.
      - name: pytest unit
        env:
          HYPOTHESIS_SCALE: ${{ github.base_ref == 'main' && '1' || '0.1' }}
        run: uv run pytest tests/unit/ -q

      # 스텝을 나눠 두면 실패가 어느 계층인지 job 로그 한 줄로 갈린다.
      - name: pytest http (경계 스냅샷)
        run: uv run pytest tests/http/ -q

  typecheck:
    name: frontend typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (locked)
        run: uv sync --locked --group dev

      # ubuntu-latest 는 node·corepack 내장 — setup-node 불요. pnpm 버전은 package.json packageManager 핀.
      - name: Enable corepack (pnpm)
        run: corepack enable

      # pnpm store 캐시 — typescript·openapi-typescript·playwright 를 매 실행 새로 내려받지 않게.
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend deps (frozen)
        run: pnpm install --frozen-lockfile

      # 생성 TS 타입이 최신 OpenAPI(ViewModel)와 일치하는지 — 엔드포인트 변경 후 codegen 미실행(drift) 차단.
      - name: codegen drift check
        run: |
          pnpm run codegen
          git diff --exit-code -- src/assessment_engine/web/static/js/generated/api.ts

      # `// @ts-check` 를 단 클라 JS 가 생성 타입 계약을 지키는지 컴파일로 강제한다.
      - name: tsc typecheck
        run: pnpm run typecheck

  build:
    name: wheel build
    runs-on: ubuntu-latest
    needs: [lint]
    # 패키징 검증은 main PR에서만 — release gate. 이미지 빌드+서명+publish 는 release.yml 이 수행.
    if: github.base_ref == 'main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 정적 자원·migrations 가 패키지에 포함되는지를 머지 전에 잡는다.
      - name: uv build
        run: uv build

      - name: wheel smoke (install + import + 자원 포함)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import assessment_engine.web.main; import assessment_engine.consumer.main; import assessment_engine.worker.main"
          /tmp/wheel-smoke/bin/python -c "from importlib.resources import files; p = files('assessment_engine'); assert (p / 'web' / 'templates' / 'base.html').is_file(); assert (p / 'web' / 'static' / 'js' / 'chart-utils.js').is_file(); assert (p / 'web' / 'static' / 'css' / 'app.css').is_file(); assert (p / 'migrations' / 'env.py').is_file(); assert (p / '_alembic.ini').is_file()"

  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: [test-unit]
    # main PR 에서만. TimescaleDB 이미지를 안 가진 runner 에서 약 2분 24초, 이미지가 있으면 15초 —
    # 차이의 대부분이 pull 이다(로컬 실측, 테스트 자체는 14초). develop PR 의 CI 는 단위 테스트까지.
    if: github.base_ref == 'main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (locked)
        run: uv sync --locked --group dev

      # testcontainers 가 TimescaleDB 컨테이너를 띄운다 — runner 의 docker daemon 필요.
      # 이미지 pull 이 대부분을 차지하므로 timeout 15분은 pull 실패 재시도까지 덮는 여유값이다.
      - name: pytest integration
        run: uv run pytest tests/integration/ -q
