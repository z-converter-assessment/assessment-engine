name: ci

# 본 repo CI — PR 마다 회귀·정합 자동 차단.
# 책임: 코드 quality 보증(빌드·테스트·lint). CD(배포·secret 주입·롤백)는 인프라 repo 영역 (CLAUDE.md #A0).
#
# Job 정합 그래프:
#   lint  ───┬─> test-unit ──┐
#            │               └─> test-integration
#            └─> build ──────┘
#
# lint(가장 빠른 fast-fail) 통과 후 test-unit · build 병렬. 둘 다 통과 후 integration.

on:
  pull_request:
    branches: [main, develop]
  # PR 검증 후 merge 시점 안전망 — branch protection 누락·admin override·force-push 보호.
  push:
    branches: [main, develop]

permissions:
  contents: read

# 같은 branch에 새 push 들어오면 옛 run cancel — CI 자원 즉시 절감.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      - name: ruff check
        run: uv run ruff check .

      # Dockerfile lint — dev 한정이지만 best practice 정합. info 수준은 fail 아님.
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test-unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # --cov-report=term — console에 라인별 coverage 표시 (PR review 시 즉시 가시화).
      # --cov-report=xml — codecov·sonar 등 외부 리포터 입력용 (artifact upload).
      - name: pytest unit (with coverage)
        run: uv run pytest tests/unit/ -v --cov=assessment_engine --cov-report=term --cov-report=xml:coverage-unit.xml

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 7

  build:
    name: wheel build
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      # 본 repo CI 산출물 = Python wheel (ADR 0012).
      # `uv build`가 sdist + wheel 둘 다 생성. wheel은 hatchling이 pyproject.toml의 packages·force-include 적용.
      - name: uv build
        run: uv build

      # smoke: 빌드된 wheel을 fresh venv에 install + import 검증. 패키징 sanity test.
      # 정적 자원(templates·static)·migrations·alembic.ini 모두 포함됐는지 file existence로 확인.
      - name: wheel smoke (install + import + 자원 포함)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import assessment_engine.web.main; import assessment_engine.consumer.main; import assessment_engine.diagnostic.main; import assessment_engine.diagnostic.scheduler"
          /tmp/wheel-smoke/bin/python -c "from importlib.resources import files; p = files('assessment_engine'); assert (p / 'web' / 'templates' / 'base.html').is_file(); assert (p / 'web' / 'static' / 'js' / 'chart-utils.js').is_file(); assert (p / '_migrations' / 'env.py').is_file(); assert (p / '_alembic.ini').is_file()"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: [test-unit, build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install uv
        run: pip install uv

      - name: Install project (frozen)
        run: uv sync --frozen --group dev

      # testcontainers가 TimescaleDB 컨테이너 자동 spawn — GHA runner의 docker daemon 사용.
      - name: pytest integration (with coverage)
        run: uv run pytest tests/integration/ -v --cov=assessment_engine --cov-report=term --cov-report=xml:coverage-integration.xml

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7
