[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-engine"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "croniter>=2.0",   # 진단 스케줄러 cron 파싱 (ADR 0004)
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scope async fixture(엔진·컨테이너)가 function-scope 테스트와 같은 event loop를 공유하도록
# fixture·test 양쪽 default loop scope를 session으로 통일. (pytest-asyncio v1+ 정책)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E   pycodestyle errors
# F   pyflakes (undefined name·unused import 등)
# I   isort
# B   flake8-bugbear (mutable default arg·broad except·raise from 누락 같은 진짜 버그 catch)
# UP  pyupgrade (py312 target이면 무료 modernization — `dict|dict` syntax, f-string, walrus 등)
# SIM flake8-simplify (or-default·dict get·중복 분기 같은 가독성)
select = ["E", "F", "I", "B", "UP", "SIM"]


[tool.ruff.lint.flake8-bugbear]
# FastAPI `Depends()` / `Query()` 등은 default-argument로 호출되는 표준 패턴이라 B008 false positive 발생.
# 본 호출들을 immutable로 취급해 B008에서 제외 — FastAPI 공식 권장.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# raw SQL `CASE WHEN ... END` 표현식·`LAG() OVER (PARTITION BY ...)` window function이 한 줄에
# 자연스러운 의미 단위를 이룸. 줄바꿈하면 가독성 더 떨어져서 본 파일만 E501 line-too-long 예외.
# 일반 Python 코드의 line-too-long은 그대로 강제.
"src/assessment_engine/db/repositories/query_repository.py" = ["E501"]
# 매퍼의 긴 한글 주석·테이블·dict 매핑 한 줄 표현이 line-length 초과. 의미 단위 보존을 위해 본 파일만 예외.
"src/assessment_engine/web/services/mappers.py" = ["E501"]