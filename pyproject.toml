[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-backend"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
]


[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["web", "consumer", "db", "scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: 단위 테스트 (외부 의존성 없음)",
    "integration: 통합 테스트 (testcontainers Docker 필요)",
]