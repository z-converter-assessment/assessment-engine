[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "psycopg2-binary>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires Docker (deselect with -m 'not integration')"]

[tool.hatch.build.targets.wheel]
packages = ["web", "consumer", "db", "scheduler"]