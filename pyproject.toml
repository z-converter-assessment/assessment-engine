[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "assessment-engine"
# 릴리스 시 `uv version --bump <part>` 로 올린다.
version = "1.2.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    # starlette 보안 핀 (fastapi transitive) — CVE-2026-54283/54282·PYSEC-2026-161(Host 헤더 검증) fix.
    # fastapi 0.136 이 starlette 1.x 지원하므로 bump (이전엔 미지원이라 PYSEC-2026-161 ignore 였음).
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27",
    "alembic>=1.13",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.14.2",
    "ruff>=0.15.13",
    "hypothesis>=6.156.5",
    "jsonschema>=4.26.0",
    "pyright>=1.1.411",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scope async fixture(엔진·컨테이너)가 function-scope 테스트와 같은 event loop를 공유하도록
# fixture·test 양쪽 default loop scope를 session으로 통일. (pytest-asyncio v1+ 정책)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.pyright]
# 타입 검사 강도를 편집기 설정이 아니라 저장소에 둔다 — Pylance 와 pyright CLI 가 같은 파일을 읽으므로
# 편집기에서 통과한 것이 CLI 에서도 통과한다. .vscode/settings.json 은 어떤 도구를 쓸지만 정한다.
typeCheckingMode = "standard"
# 검사 범위는 여기서만 정한다 — Makefile·워크플로는 인자 없이 `pyright` 를 부른다.
# tests 는 아직 이 강도를 통과하지 못해 제외 상태다 (강도 정책 = ADR 0062).
include = ["src", "scripts"]
# uv 가 만드는 가상환경. CLI 가 활성 인터프리터 대신 이 경로의 의존성을 보게 한다.
venvPath = "."
venv = ".venv"

# strict 프리셋 규칙 중 현재 위반 0 인 것을 error 로 못박는다 — 이미 확보한 지점이 되돌아가지 않게 한다.
# 위반이 남은 규칙은 여기 없다 (승격·거부 판단과 근거는 ADR 0062).
reportAssertAlwaysTrue = "error"
reportDuplicateImport = "error"
reportIncompleteStub = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidStubStatement = "error"
reportInvalidTypeVarUse = "error"
reportMatchNotExhaustive = "error"
reportMissingTypeStubs = "error"
reportSelfClsParameterName = "error"
reportTypeCommentUsage = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnsupportedDunderAll = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportUnusedExpression = "error"
reportWildcardImportFromLibrary = "error"
reportDeprecated = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportConstantRedefinition = "error"
reportIncompatibleVariableOverride = "error"

# strict 프리셋도 끄는 규칙이나 위반 0 이라 켠다 — 죽은 코드·낡은 억제 주석을 잡는다.
reportUnreachable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"

# src 에 아직 위반이 남은 strict 규칙들을 scripts 에서만 error 로 올린다 — 이 디렉토리는 이미 통과하므로
# 되돌아가지 못하게 고정한다. src 가 따라잡으면 위 최상위 목록으로 합치고 본 절을 지운다.
# (pyright 는 executionEnvironments 안에서 typeCheckingMode 를 받지 않아 규칙을 직접 나열한다.)
[[tool.pyright.executionEnvironments]]
root = "scripts"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUnknownLambdaType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportPrivateUsage = "error"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E   pycodestyle errors
# F   pyflakes (undefined name·unused import 등)
# I   isort
# B   flake8-bugbear (mutable default arg·broad except·raise from 누락 같은 진짜 버그 catch)
# UP  pyupgrade (py312 target이면 무료 modernization — `dict|dict` syntax, f-string, walrus 등)
# SIM 제외 — 가독성 룰이라 false positive 빈도 높아 CI fail 이메일 폭주 원인. 진짜 버그는 E·F·B 가 잡음.
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.flake8-bugbear]
# FastAPI `Depends()` / `Query()` 등은 default-argument로 호출되는 표준 패턴이라 B008 false positive 발생.
# 본 호출들을 immutable로 취급해 B008에서 제외 — FastAPI 공식 권장.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# E501 예외 — 줄바꿈하면 의미가 파편화되는 곳만. 일반 Python 코드의 line-too-long 은 그대로 강제.
"src/assessment_engine/migrations/*" = ["E501"]                 # Alembic autogenerate 산출물 (ColumnList·CreateTable)
"src/assessment_engine/db/repositories/query/*" = ["E501"]      # raw SQL(CASE/window)·집계 한 줄
"src/assessment_engine/web/services/mappers/*" = ["E501"]       # 매퍼 한글 주석·dict 매핑 한 줄
"src/assessment_engine/config.py" = ["E501"]                    # 운영 정책 한글 주석 한 줄
