[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "assessment-engine"
# 버전은 repo 에 저장 안 함 — git tag(v*) 단일 진실 (hatch-vcs, ADR 0030).
# 빌드 시점에 tag 에서 derive. release = main 에 tag push (bump 커밋 없음).
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    # starlette 보안 핀 (fastapi transitive) — CVE-2026-54283/54282·PYSEC-2026-161(Host 헤더 검증) fix.
    # fastapi 0.136 이 starlette 1.x 지원하므로 bump (이전엔 미지원이라 PYSEC-2026-161 ignore 였음).
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27",
    "alembic>=1.13",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.14.2",
    "ruff>=0.15.13",
]

# 버전 source = git tag (ADR 0030). hatchling 이 빌드 시 tag 에서 버전 derive.
# tag 없는 dev 빌드는 마지막 tag + 거리 (예: 0.1.3.devN+g<sha>). release.yml 빌드는 tag 위에서 돌아 정확 버전.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_engine"]
# migrations·alembic.ini를 wheel 안에 동봉 — `uv pip install wheel` 후 즉시 `alembic upgrade head` 실행 가능.
# 단일 artifact 원칙 (CD에서 인프라 측이 wheel 하나만 받으면 됨).
# force-include 키는 "source 경로 = wheel 안 경로" 매핑. wheel 안 위치는 패키지 루트 안에 박음.
# migrations 는 `assessment_engine/migrations` 로 동봉 — 번들 `_alembic.ini` 의 script_location
# (`%(here)s/migrations`) 와 정합해야 wheel install 후 `alembic -c _alembic.ini upgrade head` 동작.
force-include = { "migrations" = "assessment_engine/migrations", "alembic.ini" = "assessment_engine/_alembic.ini" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scope async fixture(엔진·컨테이너)가 function-scope 테스트와 같은 event loop를 공유하도록
# fixture·test 양쪽 default loop scope를 session으로 통일. (pytest-asyncio v1+ 정책)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E   pycodestyle errors
# F   pyflakes (undefined name·unused import 등)
# I   isort
# B   flake8-bugbear (mutable default arg·broad except·raise from 누락 같은 진짜 버그 catch)
# UP  pyupgrade (py312 target이면 무료 modernization — `dict|dict` syntax, f-string, walrus 등)
# SIM 제외 — 가독성 룰이라 false positive 빈도 높아 CI fail 이메일 폭주 원인. 진짜 버그는 E·F·B 가 잡음.
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.flake8-bugbear]
# FastAPI `Depends()` / `Query()` 등은 default-argument로 호출되는 표준 패턴이라 B008 false positive 발생.
# 본 호출들을 immutable로 취급해 B008에서 제외 — FastAPI 공식 권장.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# E501 예외 — 줄바꿈하면 의미가 파편화되는 곳만. 일반 Python 코드의 line-too-long 은 그대로 강제.
"migrations/*" = ["E501"]                                       # Alembic autogenerate 산출물 (ColumnList·CreateTable)
"src/assessment_engine/db/repositories/query/*" = ["E501"]      # raw SQL(CASE/window)·집계 한 줄
"src/assessment_engine/web/services/mappers/*" = ["E501"]       # 매퍼 한글 주석·dict 매핑 한 줄
"src/assessment_engine/config.py" = ["E501"]                    # 운영 정책 한글 주석 한 줄