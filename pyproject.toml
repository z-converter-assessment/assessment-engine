[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "assessment-engine"
version = "1.3.4"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "aio-pika>=10.0.1",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=8.1.0",
    "httpx>=0.28.1",
    "alembic>=1.18.5",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.1",
    "hypothesis>=6.165.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.411",
    "coverage[toml]>=7.15.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/assessment_engine"]
omit = [
    "*/migrations/versions/*",
    "*/db/repositories/collect.py",
    "*/db/repositories/diagnostic.py",
    "*/db/repositories/query/attention.py",
    "*/db/repositories/query/metric.py",
    "*/db/repositories/query/report.py",
    "*/db/repositories/query/repository.py",
    "*/db/repositories/query/server.py",
    "*/db/repositories/query/task.py",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"

reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportUnusedClass = "none"
reportUnnecessaryIsInstance = "none"

reportUnreachable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitOverride = "error"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["docs/decisions", "docs/learning"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",     # 내장 이름 가리기
    "ASYNC", # async 함수 안 blocking 호출
    "B",     # bugbear — mutable default·raise from 누락 같은 실제 결함
    "BLE",   # blind except — 좁히지 않는 자리는 사유를 코드로 남긴다
    "C4",    # comprehension
    "D",     # docstring 형식 (PEP 257)
    "DTZ",   # naive datetime — #F2 시간대 정책의 기계 강제
    "E",     # pycodestyle
    "ERA",   # 주석 처리된 코드 — #F12
    "F",     # pyflakes
    "FURB",  # 낡은 관용구 현대화
    "G",     # logging 포맷 관용구
    "I",     # import 정렬
    "INP",   # 암묵 namespace package
    "LOG",   # logging 오용
    "N",     # 명명 규약
    "PERF",  # 성능 안티패턴
    "PIE",   # 불필요한 구문
    "PL",    # pylint
    "PT",    # pytest 스타일
    "PTH",   # os.path -> pathlib
    "PYI",   # 타입 표기 관용구
    "RET",   # return 흐름
    "RSE",   # raise 괄호
    "RUF",   # ruff 고유 (mutable dataclass default 등)
    "S",     # bandit — 보안 안티패턴
    "SIM",   # 단순화
    "SLF",   # 외부에서의 private 접근
    "T20",   # print·pprint — #F7 이 loguru 단일을 요구한다
    "TID",   # 금지 import (아래 banned-api)
    "TC",    # 런타임에 필요 없는 import 는 TYPE_CHECKING 으로
    "TRY",   # 예외 처리
    "UP",    # pyupgrade
]
ignore = [
    "D1",
    "D203",
    "D213",
    "D400",
    "D401",
    "D403",
    "D415",
    "PLR2004",
    "PLR0913",
    "PLC0415",
    "TRY003",
    "S608",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
    "ERA001",
]


[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "loguru 를 쓴다 (#F7). stdlib logging 은 sink 를 타지 않는다."
"logging.config".msg = "loguru 를 쓴다 (#F7)."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "assessment_engine.db.models.base.Base",
    "typing.TypedDict",
]
runtime-evaluated-decorators = ["dataclasses.dataclass", "hypothesis.strategies.composite"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "SLF001", "INP001"]
"scripts/**" = ["INP001"]
"src/assessment_engine/migrations/**" = ["INP001", "TID251"]
"src/assessment_engine/web/routers/**" = ["TC001", "TC002", "TC003"]
"src/assessment_engine/web/deps.py" = ["TC001", "TC002", "TC003"]
"src/assessment_engine/migrations/*" = ["E501"]                 # Alembic autogenerate 산출물 (ColumnList·CreateTable)
"src/assessment_engine/db/repositories/query/*" = ["E501"]      # raw SQL(CASE/window)·집계 한 줄
"src/assessment_engine/web/services/mappers/*" = ["E501"]       # 매퍼 한글 주석·dict 매핑 한 줄
"src/assessment_engine/config.py" = ["E501"]                    # 운영 정책 한글 주석 한 줄
