[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-engine"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "croniter>=2.0",   # 진단 스케줄러 cron 파싱 (ADR 0004)
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scope async fixture(엔진·컨테이너)가 function-scope 테스트와 같은 event loop를 공유하도록
# fixture·test 양쪽 default loop scope를 session으로 통일. (pytest-asyncio v1+ 정책)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# PyCharm 기본 inspection과 유사: pycodestyle errors(E) + pyflakes(F) + isort(I)
select = ["E", "F", "I"]