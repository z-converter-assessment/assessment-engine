[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-engine"
version = "0.1.0"  # x-release-please-version
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "croniter>=2.0",   # 진단 스케줄러 cron 파싱 (ADR 0004)
    "prometheus-fastapi-instrumentator>=7.1.0",   # /metrics endpoint + HTTP 계측 (ADR 0011)
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.14.2",
    "ruff>=0.15.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_engine"]
# migrations·alembic.ini를 wheel 안에 동봉 — `uv pip install wheel` 후 즉시 `alembic upgrade head` 실행 가능.
# 단일 artifact 원칙 (CD에서 인프라 측이 wheel 하나만 받으면 됨).
# force-include 키는 "source 경로 = wheel 안 경로" 매핑. wheel 안 위치는 패키지 루트 안에 박음.
force-include = { "migrations" = "assessment_engine/_migrations", "alembic.ini" = "assessment_engine/_alembic.ini" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scope async fixture(엔진·컨테이너)가 function-scope 테스트와 같은 event loop를 공유하도록
# fixture·test 양쪽 default loop scope를 session으로 통일. (pytest-asyncio v1+ 정책)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E   pycodestyle errors
# F   pyflakes (undefined name·unused import 등)
# I   isort
# B   flake8-bugbear (mutable default arg·broad except·raise from 누락 같은 진짜 버그 catch)
# UP  pyupgrade (py312 target이면 무료 modernization — `dict|dict` syntax, f-string, walrus 등)
# SIM flake8-simplify (or-default·dict get·중복 분기 같은 가독성)
select = ["E", "F", "I", "B", "UP", "SIM"]


[tool.ruff.lint.flake8-bugbear]
# FastAPI `Depends()` / `Query()` 등은 default-argument로 호출되는 표준 패턴이라 B008 false positive 발생.
# 본 호출들을 immutable로 취급해 B008에서 제외 — FastAPI 공식 권장.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate 산출물 — line length(E501)는 자동 생성된 ColumnList·CreateTable 인자 나열 때문.
# 사람이 자주 손대는 코드 아니므로 ignore. 다른 룰은 그대로 적용.
"migrations/*" = ["E501"]
# raw SQL `CASE WHEN ... END` 표현식·`LAG() OVER (PARTITION BY ...)` window function이 한 줄에
# 자연스러운 의미 단위를 이룸. 줄바꿈하면 가독성 더 떨어져서 본 파일만 E501 line-too-long 예외.
# 일반 Python 코드의 line-too-long은 그대로 강제.
"src/assessment_engine/db/repositories/query_repository.py" = ["E501"]
# 매퍼의 긴 한글 주석·테이블·dict 매핑 한 줄 표현이 line-length 초과. 의미 단위 보존을 위해 본 파일만 예외.
"src/assessment_engine/web/services/mappers.py" = ["E501"]
# 운영 정책 단일 진실 한글 주석(TTL 임계·운영 신호)이 한 줄에 의미 단위 — 줄바꿈하면 의미 파편화.
"src/assessment_engine/config.py" = ["E501"]
# FastAPI Query/Path/Body description 한글 문자열이 UI 노출 텍스트 — 줄바꿈하면 문자열 합성 분기 발생.
"src/assessment_engine/web/routers/pages.py" = ["E501"]