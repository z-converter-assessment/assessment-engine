# Alembic 설정. 패키지 안에 두어 wheel 과 이미지에 함께 담긴다 — 마이그레이션을 실행하는 주체가
# 개발자 셸이 아니라 배포된 컨테이너다. 루트에 alembic.ini 가 없어 진입점
# `assessment_engine.migrate` 가 본 파일을 패키지에서 찾아 alembic 에 넘긴다.

[alembic]
# %(here)s 는 본 파일 위치 — 어느 디렉토리에서 실행하든 같은 리비전 디렉토리를 가리킨다.
script_location = %(here)s/migrations
# 경로 리스트 구분자를 OS 기본값으로 (Linux ':', Windows ';').
path_separator = os
# 접속 URL 은 env.py 가 애플리케이션 설정에서 읽어 넣는다 — 본 값은 쓰이지 않는다.
sqlalchemy.url =

[post_write_hooks]

# 아래 로깅 섹션은 env.py 가 fileConfig 로 읽어 적용한다.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
