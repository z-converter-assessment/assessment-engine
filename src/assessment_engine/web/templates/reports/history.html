{% extends "base.html" %}
{% block title %}ZConverter Assessment — 보고서 이력{% endblock %}

{% block content %}
<a class="back no-print" href="{{ back_url }}">&larr; 이전</a>
<h1>보고서 이력</h1>
<p style="color:#64748b; font-size:13px; margin-bottom:16px;">
  고객/엔지니어 보고서 발행 이력.
</p>

<form method="get" class="search-row no-print" id="report-history-filter" style="margin:16px 0 20px;">
  <select name="days">
    {% for d in [1, 3, 7, 14, 30, 90] %}
    <option value="{{ d }}" {% if d == days %}selected{% endif %}>최근 {{ d }}일</option>
    {% endfor %}
    <option value="0" {% if days == 0 %}selected{% endif %}>전체 기간</option>
  </select>
  <select name="view">
    <option value="all" {% if view == "all" %}selected{% endif %}>양식 전체</option>
    <option value="customer" {% if view == "customer" %}selected{% endif %}>고객 보고서</option>
    <option value="engineer" {% if view == "engineer" %}selected{% endif %}>엔지니어 보고서</option>
  </select>
  <select name="scope">
    <option value="all" {% if scope == "all" %}selected{% endif %}>범위 전체</option>
    <option value="environment" {% if scope == "environment" %}selected{% endif %}>환경 전체</option>
    <option value="server" {% if scope == "server" %}selected{% endif %}>서버 1대</option>
  </select>
  {% if server_public_ids %}
    {% for pid in server_public_ids %}
    <input type="hidden" name="server_public_ids" value="{{ pid }}">
    {% endfor %}
  {% endif %}
</form>

<div id="report-history-results">
  {% include "reports/_history_results.html" %}
</div>
<script src="/static/js/pages/reports-history.js?v={{ asset_v }}" defer></script>
{% endblock %}
